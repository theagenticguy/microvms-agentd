# SPDX-License-Identifier: Apache-2.0
# Accepted findings, each with its reason (same rule as .trivyignore.yaml: an
# ignore without a reason is a finding someone silenced).
#
# osv-scanner cannot consume VEX documents, so this file exists as a mirror:
# every vulnerability ignored here MUST also carry a statement in
# .vex/microvms-agentd.openvex.json, which is the canonical record grype and
# trivy consume. See .vex/README.md.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0235"
# rkyv 0.7 appears in Cargo.lock only as an OPTIONAL dependency of rust_decimal
# whose feature this workspace never enables — `cargo tree -i rkyv` prints
# "nothing to print" because no crate actually depends on it and it is never
# compiled. The lockfile records optional deps regardless; the advisory's code
# cannot be reached from any built artifact. Re-check if rust_decimal's
# `rkyv` feature is ever turned on.
reason = "optional rust_decimal feature, never enabled; not compiled into any artifact"

[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
# extract-zip 2.0.1 sits in site/pnpm-lock.yaml under @lhci/cli -> lighthouse -> puppeteer-core ->
# @puppeteer/browsers, which uses it to unpack browser archives its own downloader fetches. The
# docs site's Lighthouse tier runs lhci against the Chromium playwright installed (CHROME_PATH), so
# that downloader never runs and nothing is ever extracted; the package is a devDependency that
# ships in no artifact, and no fixed release exists to override to. Mirrors the VEX statement.
reason = "puppeteer's browser downloader is never invoked (CHROME_PATH); devDependency of the docs site only; no fixed release"
