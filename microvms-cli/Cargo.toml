[package]
name = "microvms-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "the `microvm` binary: a working sandbox in one command, and nothing microvms-core does not do"

# ── no lib target, deliberately (ARCH-5) ────────────────────────────────────
#
# There is exactly one `[[bin]]` below and no `src/lib.rs`, so this crate exports
# nothing a binding could depend on. That absence *is* ARCH-5's witness ("nothing a
# binding needs lives in the CLI") and it is asserted mechanically:
# `tests/dependency_direction.rs` reads `cargo metadata` and fails if a `lib` target
# ever appears here. Compare the alternative — a lib target with a doc comment asking
# people not to use it — which is a request rather than a property.
[[bin]]
name = "microvm"
path = "src/main.rs"

# ── the dependency set is the requirement under test (CLI-2, AC-5-4) ────────
#
# Six direct dependencies and no seventh. There is no `reqwest`, no `aws-*`, no
# `hyper`, no `aws-sigv4`, and there cannot be one: `tests/thinness.rs` reads this
# manifest through `cargo metadata` and asserts the direct dependency set is *exactly*
# the names below. An allowlist rather than a denylist, because a denylist is defeated
# by the one crate nobody thought to write down — which is the failure shape the
# Python's three-legged static guard (`tests/test_cli.py:209`, `:261`, `:281`) was
# built out of after each leg was defeated on purpose.
#
# It was seven for a while. `exec --stream` consumes a stream, `Stream` is not in
# `std`, and `microvms-core` did not re-export the trait — so this crate named
# `futures-util` in order to call `poll_next`, with a five-paragraph justification
# beside it. That justification held (a trait definition opens no socket) and was still
# the wrong shape: the dependency existed to advance a loop. Core grew
# `ExecHandle::for_each_event`, a callback driver over the same state machine whose
# signature is `FnMut(ExecEvent) -> ControlFlow<()>` — both `std` — and the entry came
# out. The count is back to six and the honest reading of that is not "we removed a
# dependency" but "the seam was in the wrong place and moving it removed one".
#
# The CLI reaches AWS through `microvms-core` and through nothing else. That is
# CLI-2, and the honest way to state it is a manifest a test can read.
[dependencies]
# The whole product surface. Every AWS call, every trap closure, the cost engine,
# and the error taxonomy the exit table is a rendering of.
microvms-core = { path = "../microvms-core" }
# No direct `protocol` edge: the wire types are named through
# `microvms_core::protocol::` (core's re-export), so this crate has exactly one
# door to everything below it. The direct edge existed while core lacked the
# re-export and was retired as the "fine future cleanup" its own comment named.
# 4.6.6 was the registry's max_stable_version on 2026-08-08 (research-cli.yaml).
# `derive` because the command tree is the manifest's only source: a builder tree
# would be a second place the surface is written down.
clap = { version = "4.6.6", features = ["derive"] }
# The interactive surface (CLI-1). Default features keep the crossterm backend, which
# is what `ratatui::init`/`restore` use and what installs the panic hook that
# un-wedges a terminal (research-cli.yaml sources [8][9]).
ratatui = "0.30.2"
# The envelope. Hand-rolling the JSON was considered and rejected: the envelope has a
# string field carrying a service error message, and hand-escaping that is how a
# quote in an AWS error breaks an agent's parse.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `rt-multi-thread` because this crate *is* the process and therefore is the thing
# entitled to choose a runtime — `microvms-core` deliberately does not (its tokio
# entry carries no runtime feature). `signal` is CLI-6's interrupt: `ctrl_c()` is a
# future the launch path selects against, which is what makes the guard testable
# without sending a real signal to a test process.
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
] }

[dev-dependencies]
# The structural guards read the real dependency graph rather than parsing TOML:
# `cargo metadata` resolves path dependencies and workspace inheritance, so an edge
# added transitively or through a renamed key is still an edge this sees. Parsing
# `Cargo.toml` by hand would check the file, not the build.
cargo_metadata = "0.23.1"
# The same tokio, with the test clock. **Not a seventh dependency** — it is the
# sixth again, and `tests/thinness.rs`'s equality dedups the two edges, which is
# why that guard still reads six names plus `cargo_metadata`.
#
# `test-util` is what `#[tokio::test(start_paused = true)]` needs. One guard requires
# it: the cut-stream test drives core's reconnect loop, which backs off up to four
# seconds across twenty attempts, so a real clock spends about a minute inside one
# test. `mise run check` is a pre-push gate, and a gate that costs a minute for one
# assertion is a gate people learn to skip.
#
# A dev-dependency rather than a feature on the normal entry, deliberately: under
# resolver 3 a dev-only feature is not unified into a non-test build, so `cargo build`
# ships a binary with no test clock in it. Enabling `test-util` on the normal entry
# would put tokio's time-manipulation surface in the shipped artifact for a test's
# benefit, which is the same trade `envelope.rs` refuses with `into_streams` being
# `cfg(test)`.
tokio = { version = "1.53", features = ["test-util"] }
