name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated once: every job here reads the repo and writes
# nothing. A job that someday needs more (artifact attestation, SARIF upload)
# raises it per-job rather than widening the default.
permissions:
  contents: read

# A push that supersedes a running PR build cancels it; main never cancels, so
# the history of green on main stays gap-free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# ── on the action versions below ────────────────────────────────────────────
#
# Every `uses:` in this file resolves to a Node **24** action, and that is a
# requirement rather than a preference: the runner deprecated Node 20 on
# 2025-09-19 and now forces such actions onto 24 anyway, printing a warning per
# step. A warning that appears on every green run is a warning nobody reads, so
# the versions here are chosen to emit none — `checkout@v5`, `setup-uv@v7`,
# `upload-artifact@v6`, `setup-node@v5` are the first major of each on Node 24.
#
# Two of them could go further and deliberately do not:
#
# * `checkout` is on v5 rather than v7. v6 moved the persisted credential into a
#   separate file and v7 blocks fork-PR checkout under `pull_request_target` and
#   `workflow_run` — both good changes, and neither of them anything this repo
#   uses (no workflow here has either trigger, and the only post-checkout git
#   consumer is betterleaks reading history). v5 is the smallest version that
#   satisfies the actual requirement, which is the Node runtime.
# * `setup-uv` is on the `v7` **major** tag rather than the newer `v9.0.0`. From
#   v8 astral stopped publishing major and minor tags on purpose, for supply-chain
#   reasons — so v9 can only be referenced as an exact version or a git hash. When
#   this paragraph was written the repo had no Dependabot, and an exact pin with
#   nothing watching it is a pin that silently stops receiving patches; a rolling
#   major keeps getting them, and v7 is the last major that offers that and is
#   already on Node 24. `.github/dependabot.yml` now watches github-actions
#   weekly, so the prerequisite is met: the follow-up is to pin the hash and
#   delete this paragraph in the change that does it.
#
# `dtolnay/rust-toolchain` and `aquasecurity/trivy-action` are composite actions
# with no Node runtime at all, and `Swatinem/rust-cache@v2` is already Node 24.

jobs:
  rust:
    name: lint, model, and test tiers (${{ matrix.os }})
    # The daemon ships to Linux only (a MicroVM guest), but the CLI, the library,
    # and the bindings run wherever a developer sits — so the client tiers build
    # and test on all three platforms. The matrix is here rather than in a
    # separate job so a platform break fails the same required check as a logic
    # break; ubuntu remains the only place the full daemon suite runs, because
    # agentd's exec/fs tiers assume a Unix process model on purpose (the guest
    # is one).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - name: clippy (client crates everywhere, everything on linux)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo clippy --all-targets -- -D warnings
          else
            # Not the binding crates: pyo3 wants a Python to link against on
            # Windows and napi wants its build tooling; both get their real
            # coverage in the `bindings` job, under the toolchains that ship them.
            cargo clippy -p protocol -p microvms-core -p microvms-cli -p agentd-model --all-targets -- -D warnings
          fi
      # Linux: one command covers all six tiers — the daemon's unit tests, the
      # stateright model over every reachable state, the proptest tar-confinement
      # properties, the turmoil transport-fault simulation, the panic guard, and
      # the schema artifact's staleness and route-coverage checks.
      # macOS/Windows: the client crates only — protocol, core (incl. its turmoil
      # tier), the CLI's five test targets, and the model. agentd stays behind:
      # it is guest software, and nix/sethostname/bind-mounts do not exist to
      # test on a laptop OS.
      - name: test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo test --all
          else
            cargo test -p protocol -p microvms-core -p microvms-cli -p agentd-model
          fi
      # Belt to the test suite's braces, and not redundant: this runs the real
      # generator against the real path and fails with the regenerate command in
      # the log, so a contributor whose PR turns the artifact stale is told how to
      # fix it rather than reading an assertion diff of a 40 KB JSON file.
      #
      # A stale committed schema is the failure mode that makes a generated
      # artifact worse than no artifact at all: consumers trust it precisely
      # because it is generated, and nothing about a diff reveals that a document
      # was left describing a protocol nobody serves.
      - name: schema artifact is not stale
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p agentd --bin schema -- --check

  security:
    name: semgrep, secret history, licenses, workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # betterleaks scans history, and a shallow clone has none.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          # No cache, deliberately. `enable-cache: auto` looks for a lockfile or a
          # requirements file to key the cache on, finds none in this repo, and
          # warns "No file matched to [**/uv.lock, ...]. The cache will never get
          # invalidated" — because every Python entry point here is either a `uvx`
          # tool invocation or a PEP 723 script whose dependencies live in its own
          # header. There is no lockfile to point `cache-dependency-glob` at, and
          # adding one to satisfy a cache key would be a file with no other reader.
          # A cache that can never be invalidated is worse than no cache: it would
          # pin a resolved `semgrep` or `boto3` for as long as the entry survived,
          # and boto3's bundled service model is exactly what the drift gate exists
          # to read fresh.
          enable-cache: false
      # Shipped source only: test fixtures plant fake tokens on purpose, and the
      # INFO tier (std::env::args in a CLI, TempDir in tests) is idiom, not
      # defect. WARNING and ERROR fail the job.
      - name: semgrep
        run: |
          uvx semgrep scan --config p/rust --config p/secrets \
            --severity WARNING --severity ERROR --error --quiet --metrics=off \
            protocol/src agentd/src model/src microvms-core/src microvms-cli/src microvms-py/src microvms-js/src
      # The whole history, not the tree: a secret committed and later deleted is
      # published the moment the repo is public.
      - name: betterleaks over full history (pinned, checksummed)
        run: |
          curl -sSfL -o bl.tgz https://github.com/betterleaks/betterleaks/releases/download/v1.7.3/betterleaks_1.7.3_linux_x64.tar.gz
          echo "9d2ed6fc387bc1c3f95557d5539077b1ce422f0db5ec38db5f14a141ad2947bf  bl.tgz" | sha256sum -c -
          tar -xzf bl.tgz betterleaks
          ./betterleaks git .
      - name: license headers
        run: ./scripts/check-license-headers.py
      # The LICENSE file itself, and the crate manifests agreeing with it. The
      # dependency-license audit is cargo-deny, two steps down; this asserts the
      # repo's own claim is consistent.
      - name: license consistency
        shell: bash
        run: |
          test -s LICENSE
          grep -q "Apache License" LICENSE
          for m in $(git ls-files '*/Cargo.toml'); do
            grep -Eq 'license(\.workspace)?[[:space:]]*=' "$m" || { echo "$m declares no license"; exit 1; }
          done
      # The dependency-license policy (deny.toml): a measured allowlist of the
      # licenses actually in the tree, copyleft absent by construction, yanked
      # crates and unknown registries denied. The "every dep is permissive
      # today" claim the previous comment made is now a gate instead of an
      # observation. Proven able to fail: removing MIT from the allowlist
      # rejects 119 crates.
      - name: cargo-deny (dependency licenses, yanked crates, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          rust-version: stable
      # The only linter that reads the workflows themselves. Before it, a
      # workflow mistake was found by the workflow misbehaving.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true

  sbom:
    name: SBOM and vulnerability scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # syft writes the SBOM, grype audits the SBOM, trivy audits the tree
      # (vulns + IaC misconfig + secrets), osv-scanner audits the lockfiles
      # against OSV directly. Three scanners because their databases disagree
      # at the margins; every accepted finding lives in .trivyignore.yaml or
      # osv-scanner.toml with its reason recorded.
      # Pinned version + sha256 per binary, not `install.sh | sh` off a branch:
      # this is the job whose entire output is supply-chain assurance, so its own
      # inputs are the last place an unpinned fetch belongs. Refreshing a pin
      # means updating the version AND the hash from the release's checksums.txt.
      - name: install syft and grype (pinned, checksummed)
        run: |
          curl -sSfL -o syft.tgz https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz
          echo "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft && sudo mv syft /usr/local/bin/
          curl -sSfL -o grype.tgz https://github.com/anchore/grype/releases/download/v0.116.1/grype_0.116.1_linux_amd64.tar.gz
          echo "0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458  grype.tgz" | sha256sum -c -
          tar -xzf grype.tgz grype && sudo mv grype /usr/local/bin/
      - name: generate SBOMs (CycloneDX + SPDX)
        run: |
          mkdir -p sbom
          syft . --exclude './conformance/infra/.terraform/**' --exclude './target/**' --exclude './microvms-js/node_modules/**' \
            -o cyclonedx-json=sbom/microvms-agentd.cdx.json \
            -o spdx-json=sbom/microvms-agentd.spdx.json -q
      - name: grype (audits what the SBOM publishes)
        run: grype sbom:sbom/microvms-agentd.cdx.json --fail-on high
      - name: trivy (vulns, IaC misconfig, secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: conformance/infra/.terraform,target
          trivyignores: .trivyignore.yaml
      - name: osv-scanner (lockfiles against OSV; pinned, checksummed)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner && sudo mv osv-scanner /usr/local/bin/
          osv-scanner scan source -r .
      # The SBOMs are the artifact consumers actually want from this job —
      # attached per-run so any commit's inventory is downloadable, 90-day
      # default retention.
      - name: publish SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error

  drift:
    name: hardcoded constraints match the service model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          # See the `security` job: no lockfile to key a cache on, and a cache that
          # can never be invalidated would pin the boto3 whose bundled service model
          # this job's whole purpose is to read fresh.
          enable-cache: false
      # TRAP-12 says "in the build gate", and pre-push alone is not a gate — a
      # --no-verify push or a merge that trusts CI skips it. The script is a PEP
      # 723 uv script whose one dependency is boto3, for the botocore the model
      # ships inside. It reads the Rust constants via `cargo run -q -p
      # microvms-cli -- constants --emit-json` and compares them to the model,
      # plus two pinned literals of its own for the region list and the sizing
      # table — the values no model states, which lost their cross-client reader
      # when the Python client was deleted.
      - run: ./scripts/check-model-drift.py

      # Every Python file, linted here rather than in a job of its own. `conformance/run_rs.py`
      # is the live suite's driver and the `scripts/` gates are this job's own tooling, so the
      # lint belongs beside the thing it lints. The `python` job that ran the client library's
      # 83 tests went away with that client.
      #
      # `.` rather than `conformance scripts`, and the coverage guard ahead of it, because these
      # two lines had the same defect `mise run lint` did: ruff discovers Python by extension, so
      # `scripts` — seven extensionless PEP 723 gates at the time — contributed nothing, and both
      # lines passed over one file while reading as though they covered two directories. The gates
      # are now named `scripts/*.py`, which is what makes them ordinary Python to ruff and to
      # `check-license-headers.py` alike (issue #32), and `check-lint-coverage.py` is what keeps
      # that honest. A single `.` on both sides is also what makes this job and `mise run lint`
      # provably the same check rather than two path lists that agree today.
      - run: ./scripts/check-lint-coverage.py
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  bindings:
    name: python and node bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          # See the `security` job. Nothing here is locked either: `uvx maturin@1.14`
          # pins its own version inline and the venv holds exactly `pytest`, so there
          # is no file a cache key could watch.
          enable-cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The binding suites are where BIND-2/BIND-5 live: nine planted bypasses
      # (raw tokens, capability lists, bare-float dollars) each have a test that
      # goes red if the door reopens. `cargo test --workspace` reports 0 tests
      # for these crates — the guards run only under their own toolchains, so a
      # gate that skips this job would never notice a reopened trap.
      - name: python binding tests
        run: |
          uv venv .venv-bindings
          . .venv-bindings/bin/activate
          uvx maturin@1.14 develop -m microvms-py/Cargo.toml
          uv pip install pytest
          pytest microvms-py/tests -q
      # The committed `.pyi` against the crate it describes. Here rather than in the
      # `rust` job beside `schema:check`, because this is where a Python toolchain already
      # exists: the gate needs `uvx maturin generate-stubs` and an interpreter to introspect
      # against, and the `rust` matrix has neither.
      #
      # Worse than a stale schema when it drifts, which is why it is a gate and not a
      # convention: `py.typed` ships in the wheel beside the stub, so a stale stub does not
      # leave a caller unchecked — it leaves them confidently wrong, with an editor
      # approving a call that raises `AttributeError`.
      - name: python stub is not stale
        run: ./scripts/generate-py-stubs.py --check
      # The typed consumer, against the stub as a *caller* gets it: built into a wheel,
      # installed into a throwaway venv, and checked from outside the repo's own layout. A
      # check against the source tree would pass on a stub that never made it into the
      # wheel, which is the failure `py.typed` makes invisible.
      #
      # `ty` rather than mypy or pyright: it is Astral's checker, so it arrives through the
      # `uvx` already in this job with no node runtime and no second package manager, and it
      # reads `py.typed` and `.pyi` by the same PEP 561 rules. Proven able to fail — five
      # deliberate breakages of `typed_usage.py` are recorded in this commit's message.
      #
      # Pinned exactly, unlike the `uvx` tools above, and for a reason the version number
      # states: `ty` is pre-1.0 (0.0.72 here) and pre-release checkers add diagnostics
      # between patch releases. A floating pin would turn someone else's release into a red
      # build on a commit that changed nothing — the same argument `setup-uv`'s comment
      # makes, reaching the opposite conclusion because there is no rolling major to track.
      - name: typed consumer checks against the built wheel
        run: |
          uvx maturin@1.14 build -m microvms-py/Cargo.toml -o dist-wheel
          uv venv .venv-typed
          uv pip install --python .venv-typed/bin/python dist-wheel/*.whl
          uvx ty@0.0.72 check --python .venv-typed microvms-py/examples/typed_usage.py
      - name: node binding tests
        run: |
          npx -y -p @napi-rs/cli@3 napi build --manifest-path Cargo.toml --package microvms-js --platform --output-dir . --cwd microvms-js
          node --test "microvms-js/__test__/*.mjs"

  build:
    name: static aarch64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # aarch64 musl is the shipping target: every MicroVM we have run is ARM64,
      # and a static binary is what lets the daemon bake into a task's own base
      # image without depending on an interpreter that image may not have.
      - name: install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p agentd --target aarch64-unknown-linux-musl
      # The build is a gate, not a release step. v0.1.0 ships source only, so
      # nothing here publishes an artifact: a downloadable binary is a promise
      # about provenance and signing that this project has not yet made. What the
      # job proves is that the shipping target still cross-compiles and still
      # links statically, which is what breaks silently when a dependency
      # acquires a C shim.
      - name: report size and linkage
        run: |
          ls -l target/aarch64-unknown-linux-musl/release/agentd
          file target/aarch64-unknown-linux-musl/release/agentd

# The requirements-verification job (symspec over spec/*.symspec.json) ran here
# while symspec was on npm. The tool this repo actually needs is the v5 line
# (1.0.0-alpha.0) — the only version that can read core.symspec.json's state
# model and reachability tier — and it is not published anywhere yet; it runs
# from a local checkout via `mise run spec:core`. A CI job that installed the
# 0.1.0 registry package would verify the six-requirement daemon draft and skip
# the 51 requirements that matter, which is worse than no job: green next to
# the word "requirements" reads as "the requirements were verified". The job
# returns when symspec 1.x is installable from a registry or vendorable.
