name: addons

# Manual only, and it publishes nothing. This builds the Node addon for every configured
# platform and uploads each one as an artifact, so a machine that cannot cross-compile to
# macOS or Windows can still obtain all of them.
#
# That separation is what removes a credential from the npm bootstrap. npm requires a package
# to exist before a trusted publisher can be configured for it, and there is no scope-level
# configuration — so the root package and all four platform packages must be created once by
# something that is not OIDC. Publishing from CI would mean an npm token in this repository's
# secrets; publishing from a maintainer's terminal needs the binaries, which is what this
# produces. Build here, publish there, and no long-lived credential exists in either place.
#
# Useful beyond the bootstrap: adding a platform triple creates another package OIDC cannot
# create, so the same dance recurs, and a developer who wants a cross-platform addon without
# cutting a release can run this too.
on:
  workflow_dispatch:

# Reads the repository and writes nothing. There is deliberately no `id-token` and no
# `contents: write` here — a build job that cannot publish is a build job whose compromise
# publishes nothing.
permissions:
  contents: read

jobs:
  addons:
    name: build the node addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      # The triples must match `microvms-js/package.json`'s `napi.targets`, which is the
      # source of truth for what packages exist on npm — a triple here that is missing there
      # builds an artifact no package wants, and the reverse ships a root package whose
      # `optionalDependencies` names a platform nothing built.
      # `scripts/check-publishable.py` asserts the two agree, for this file and `release.yml`
      # together. The runner choice stays here: which machine builds a triple is CI's
      # business, not the package's.
      # `cross` is `--cross-compile` for the glibc targets and empty elsewhere, and it decides
      # whether the addon runs anywhere but this month's runner image. A native build links
      # against the host's glibc: `ubuntu-latest` is Ubuntu 24.04, so the addon requires
      # GLIBC_2.39 and fails to load on every current distribution below that. Measured, see
      # `scripts/check-addon-glibc.py`.
      #
      # `--cross-compile` routes through `cargo-zigbuild`, which yields GLIBC_2.30 on both linux
      # targets. `--use-napi-cross` would give a lower floor still — 2.16 — and cannot be used:
      # its toolchain is glibc-2.17-era GCC and `aws-lc-sys` does not compile for aarch64 with
      # it (no `stdatomic.h`, no `AT_HWCAP2`, `-march=armv8.4-a+sha3` unknown). That is what
      # broke the v0.1.0 release, after the x64 leg passed and hid it.
      #
      # Both linux targets build on the x64 runner: zig cross-compiles to arm64, so a native
      # arm64 runner would only reintroduce its own glibc.
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: '--cross-compile' }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: '--cross-compile' }
          - { runner: macos-latest, target: aarch64-apple-darwin, cross: '' }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, cross: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # zig is the compiler and linker behind `--cross-compile`, and napi auto-installs
      # `cargo-zigbuild` but not zig itself. Pinned and checksummed rather than fetched from a
      # third-party action, matching how `ci.yml` obtains syft, grype, betterleaks and
      # osv-scanner: refreshing this means updating both the version and the hash from
      # https://ziglang.org/download/index.json.
      #
      # `cargo-zigbuild` also accepts a pip-installed `ziglang` module, which is NOT used here
      # because the verification behind this change ran against a real zig binary. Shipping the
      # arrangement that was measured beats shipping the one that should also work.
      - name: install zig (pinned, checksummed)
        if: matrix.cross != ''
        run: |
          set -euo pipefail
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: zig is on PATH
        if: matrix.cross != ''
        run: zig version

      # `--release` matters: a debug addon is around 250 MB against a few tens of megabytes
      # stripped, and npm would carry that forever at an immutable version.
      - name: napi build
        working-directory: microvms-js
        run: >
          npx -y -p @napi-rs/cli@3 napi build
          --manifest-path ../Cargo.toml --package microvms-js
          --platform --release --target ${{ matrix.target }} ${{ matrix.cross }} --output-dir .

      # Only the glibc legs have a floor to assert, which is exactly `cross != ''`.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: matrix.cross != ''
        with:
          enable-cache: false
      - name: the addon does not demand a newer glibc than its oldest supported host
        if: matrix.cross != ''
        run: ./scripts/check-addon-glibc.py microvms-js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: addon-${{ matrix.target }}
          path: microvms-js/*.node
          if-no-files-found: error

      # The generated loader and type declarations, from ONE leg. Both are
      # platform-independent — the loader enumerates every configured target and picks at
      # runtime — and both are gitignored, so a job that publishes without building has no
      # other way to obtain them, and `package.json` names `index.js` in `files` and points
      # `main` at it. Uploading from all four legs would mean four artifacts of identical
      # content with no designated source.
      #
      # The loader is also generated against whatever `name` was in `package.json` at build
      # time, which is why it has to come from a build of THIS commit rather than a developer's
      # working copy. `scripts/check-npm-loader.py` asserts the two agree.
      - name: upload the generated loader and types
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binding-js
          path: |
            microvms-js/index.js
            microvms-js/index.d.ts
          if-no-files-found: error
