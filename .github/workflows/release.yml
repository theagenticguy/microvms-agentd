name: release

# Tag-triggered, and the tag is the only input. Every registry config pins trust to THIS
# filename, so renaming this file silently invalidates five trusted-publisher configurations:
# three crates on crates.io, one project on PyPI, one package on npm. npm does not validate
# its configuration when you save it, so the error appears only at publish time.
on:
  push:
    tags: ['v*']

# Least privilege as the default. Each publish job raises exactly what its OIDC exchange
# needs and nothing else, which is what makes `id-token: write` meaningful rather than
# ambient.
permissions:
  contents: read

# Never cancels. A superseded release is not a superseded build: the earlier run may already
# have put immutable versions on a registry, and interrupting it leaves a partial release
# that no rollback exists for.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ── on the absence of secrets ───────────────────────────────────────────────
#
# There is no `secrets.CARGO_REGISTRY_TOKEN`, no `secrets.PYPI_TOKEN`, and no
# `secrets.NPM_TOKEN` in this file, and that is the point rather than an omission. All three
# registries mint a short-lived credential from the OIDC identity token GitHub issues to
# this workflow: crates.io through `rust-lang/crates-io-auth-action` (30-minute token), PyPI
# through the publish action's own exchange, and npm inside the CLI itself. Nothing
# long-lived exists to leak, rotate, or revoke.
#
# napi's own template configures an `NPM_TOKEN` secret and says so; this file deliberately
# departs from it.
#
# The `release` environment gates all three. It requires a human approval and is restricted
# to `v*` tags, so a compromised push to a branch cannot reach a registry even with this
# file's permissions.

jobs:
  # Runs first and gates everything, because the cheapest failure is the one before any
  # irreversible act. A tag whose number disagrees with a manifest is the defect this
  # catches: the version a consumer receives comes from the manifest, the three manifests
  # live in unrelated files, and a release that bumps two of three publishes a wrong version
  # that no registry lets you withdraw.
  guard:
    name: the tag and the manifests agree
    runs-on: ubuntu-latest
    steps:
      # Whole history, because the ancestry check below needs it and a shallow clone has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Catches a tag created on a branch that was never merged, which is what tagging from a
      # working branch produces.
      #
      # It does NOT catch a stale tag reused from an earlier attempt, and that limit is measured
      # rather than assumed: a leftover local `v0.1.0` from 2026-08-06 pointed at a commit
      # older than the crate rename and the publish flags, and that commit is a perfectly good
      # ancestor of main — this check passes it. The manifest comparison below cannot separate
      # them either, because every version in this repository read `0.1.0` for weeks, so a
      # stale tag agrees with the manifests it predates.
      #
      # `mise run release:tag` is the control for that case, because the mistake happens at
      # tag time, not at run time.
      - name: the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), which is not on main."
            echo "Tagging from a working branch produces this; tag a commit that is on main."
            exit 1
          fi
          echo "$TAG -> $(git rev-parse --short HEAD), on main"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: publish set, manifest metadata, and tag agreement
        run: ./scripts/check-publishable.py --tag=${{ github.ref_name }}
      # The same dry run `ci.yml` performs on every pull request, repeated here against the
      # exact commit being released. Cheap next to a partial publish, and it is the only
      # place the `microvms-core -> microvms-protocol` edge resolves the way a consumer will
      # resolve it rather than through the path dependency.
      - name: every crate still packages and verifies
        run: ./scripts/check-publishable.py --dry-run

  crates-io:
    name: publish to crates.io
    # Waits for EVERY artifact to build, not just the guard, and that ordering is what v0.1.0
    # was missing. With `needs: guard` alone this job published three immutable crates while the
    # aarch64 wheel and addon were still failing, so PyPI and npm skipped and 0.1.0 became a
    # version that exists on one registry of three and can never exist on the other two.
    #
    # Nothing here makes a release atomic — crates.io, PyPI and npm are three separate
    # irreversible acts. What this does is move every *buildable* failure ahead of the first
    # one, so a broken artifact costs a re-tag rather than a burnt version number.
    needs: [guard, wheels, sdist, addons]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # exchanged for a 30-minute crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # `--workspace` publishes in dependency order, which Cargo has done natively since
      # 1.90. One OIDC exchange covers all three crates because each one's trusted-publisher
      # configuration names this repository and this filename, so the minted token is scoped
      # to every crate whose configuration matched.
      #
      # NOT atomic. A network failure between crates leaves some published and some not, and
      # re-running fails on the ones that already exist because `cargo publish` has no
      # `--skip-existing`. Completing a partial release means publishing the remainder by
      # name, with the same commit checked out.
      - name: cargo publish
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ── PyPI ────────────────────────────────────────────────────────────────
  #
  # Built on five runners and published from one, because a wheel is per-platform and a
  # trusted publisher is per-project. `abi3-py39` is what keeps this to five artifacts
  # instead of five times the number of supported interpreters: one wheel per platform loads
  # on CPython 3.9 and every version after it.
  wheels:
    name: build the wheel (${{ matrix.runner }} ${{ matrix.target }})
    needs: guard
    strategy:
      fail-fast: false
      # `zig` is set only on the aarch64 linux leg, and it is what makes that wheel exist at
      # all. `manylinux: auto` for aarch64 selects a manylinux2014 cross container whose GCC is
      # glibc-2.17 era, and `aws-lc-sys` does not compile with it — no `stdatomic.h`, no
      # `AT_HWCAP2`, `-march=armv8.4-a+sha3` unknown. That is what failed the v0.1.0 release.
      #
      # `maturin --zig` compiles through zig instead and produces a wheel tagged
      # `manylinux_2_17_aarch64`, whose extension module was verified to reference nothing above
      # GLIBC_2.17 — the tag checked against the shipped `.so`'s symbols rather than trusted,
      # because an overstated manylinux tag is an install that succeeds and an import that
      # fails.
      #
      # `container: off` runs maturin on the runner rather than in that container, which is the
      # arrangement the verification used: maturin finds zig on PATH.
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto, container: '', zig: '' }
          - { runner: ubuntu-latest, target: aarch64, manylinux: '2_17', container: 'off', zig: '--zig' }
          - { runner: macos-latest, target: aarch64, manylinux: '', container: '', zig: '' }
          # Cross-compiled from the arm64 macOS runner rather than built natively: Rust
          # demoted `x86_64-apple-darwin` to Tier 2 in 1.90 and GitHub is discontinuing free
          # macOS x86_64 runners for public repositories.
          - { runner: macos-latest, target: x86_64, manylinux: '', container: '', zig: '' }
          - { runner: windows-latest, target: x64, manylinux: '', container: '', zig: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: matrix.zig != ''
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      # The same pinned tarball the addons job uses, for the same reason: one zig acquisition
      # mechanism, and the one the verification ran against.
      - name: install zig (pinned, checksummed)
        if: matrix.zig != ''
        run: |
          set -euo pipefail
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release -m microvms-py/Cargo.toml --out dist ${{ matrix.zig }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          sccache: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-wheel-${{ matrix.runner }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  sdist:
    name: build the source distribution
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Verified buildable rather than assumed: maturin vendors the workspace path
      # dependencies into the archive, so `pip install` from this sdist compiles
      # `microvms-protocol` and `microvms-core` from source and the module imports. An sdist
      # that cannot build is worse than none, because pip prefers it over failing outright on
      # a platform with no wheel.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m microvms-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-sdist
          path: dist
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # exchanged for a short-lived PyPI token, and signs the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      # Every wheel against its own manylinux tag, before anything immutable is uploaded. pip
      # selects by that tag and trusts it, so an overstated one installs and then fails to
      # import — and the aarch64 wheel is built through zig precisely to keep that claim true.
      - name: every wheel honours its manylinux tag
        run: ./scripts/check-addon-glibc.py dist
      # No `password:` and no `user:`. The action performs the OIDC exchange itself, and it
      # generates and uploads PEP 740 attestations by default — so provenance needs no
      # configuration here, only the permission above.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # ── npm ─────────────────────────────────────────────────────────────────
  #
  # Four builds, ONE package. The addon is a compiled artifact per platform, and the usual
  # napi layout publishes a package per platform plus a root that selects between them through
  # `optionalDependencies`. This ships all four binaries in the single package instead, which
  # the generated loader already supports because it tries a local
  # `./<binaryName>.<suffix>.node` before any per-platform package.
  #
  # The trade is measured: 12.2 MB packed and 25.9 MB unpacked against roughly 3 MB for the
  # matching-platform-only layout. What it buys is one trusted-publisher configuration instead
  # of five, and — the reason it is worth it — no bootstrap problem when a platform is added.
  # npm cannot create a package over OIDC, so under the split layout every new triple needs a
  # fresh non-OIDC publish with a credential to match. Under one package a new triple is a
  # matrix entry.
  addons:
    name: build the node addon (${{ matrix.target }})
    needs: guard
    strategy:
      fail-fast: false
      # See `addons.yml` for why `cross` exists and why both glibc targets build on the x64
      # runner. A native build inherits the runner image's glibc as a floor on every consumer,
      # and that floor is invisible to any test running on the image that produced it.
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: '--cross-compile' }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: '--cross-compile' }
          - { runner: macos-latest, target: aarch64-apple-darwin, cross: '' }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, cross: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      # zig backs `--cross-compile`; napi installs `cargo-zigbuild` but not zig. Pinned and
      # checksummed, as `addons.yml` records at length.
      - name: install zig (pinned, checksummed)
        if: matrix.cross != ''
        run: |
          set -euo pipefail
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: napi build
        working-directory: microvms-js
        run: >
          npx -y -p @napi-rs/cli@3 napi build
          --manifest-path ../Cargo.toml --package microvms-js
          --platform --release --target ${{ matrix.target }} ${{ matrix.cross }} --output-dir .
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: matrix.cross != ''
        with:
          enable-cache: false
      - name: the addon does not demand a newer glibc than its oldest supported host
        if: matrix.cross != ''
        run: ./scripts/check-addon-glibc.py microvms-js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: addon-${{ matrix.target }}
          path: microvms-js/*.node
          if-no-files-found: error

      # See `addons.yml` for why this comes from one leg. Without it the root package ships
      # with no loader at all: `index.js` is gitignored, the publish job below never runs
      # `napi build`, and `files` names a file that would not exist.
      - name: upload the generated loader and types
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binding-js
          path: |
            microvms-js/index.js
            microvms-js/index.d.ts
          if-no-files-found: error

  npm:
    name: publish to npm
    needs: addons
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # the npm CLI exchanges this for a short-lived publish token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # For the PEP 723 loader gate below. No cache: see `ci.yml`'s `security` job — there is
      # no lockfile here to key one on, and that script's dependency set is empty.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      # Node 24, for npm 11.x. Trusted publishing requires npm >= 11.5.1 and Node >=
      # 22.14.0, and every Node 22 release ships npm 10.9 — so pinning the version this
      # package's `engines.node` floor allows would authenticate with a CLI that has no OIDC
      # path and fall back to looking for a token that does not exist.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Asserted rather than trusted, because the failure mode is `ENEEDAUTH` — an error
      # about credentials, from a cause that is a version.
      - name: the npm CLI can speak OIDC
        run: |
          set -euo pipefail
          npm --version
          node --version
          # Concatenation rather than a template literal: shellcheck reads `${...}` inside a
          # single-quoted argument as a shell expansion that will not expand (SC2016), and it
          # is right about the syntax even though this is JavaScript.
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number)
            if (maj < 22 || (maj === 22 && min < 14)) {
              console.error("node " + process.versions.node + " cannot mint an npm OIDC token; needs >= 22.14.0")
              process.exit(1)
            }
          '
          npx --yes semver@7 -r ">=11.5.1" "$(npm --version)" > /dev/null \
            || { echo "npm $(npm --version) predates trusted publishing (needs >= 11.5.1)"; exit 1; }
      # Every platform's addon lands beside the loader in ONE package, so they download
      # straight into the package directory rather than into a staging area. `napi
      # create-npm-dirs`, `napi artifacts` and `napi pre-publish` are all absent: those exist
      # to build and publish a package per platform, which this no longer does.
      #
      # The generated loader already prefers a local file — `require('./microvms.<triple>.node')`
      # is tried before `require('<package>-<suffix>')` — so one package carrying all four
      # binaries works with the loader unchanged and no `optionalDependencies` at all.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: addon-*
          merge-multiple: true
          path: microvms-js
      # The loader and types, which the package cannot be published without: both are
      # gitignored and this job never runs `napi build`.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: binding-js
          path: microvms-js
      # The loader is generated against whatever `name` was in `package.json` at build time and
      # nothing reconciles the two, so a rename ships a package whose `require` fails on every
      # platform while `npm install` succeeds. Measured on
      # `@theagenticguy/microvms@0.1.0-rc.1`, which shipped a loader from before the package
      # was scoped. This also asserts every configured triple has its binary present, which is
      # what `napi artifacts` used to fail on.
      - name: the loader resolves every configured platform
        run: ./scripts/check-npm-loader.py --all-platforms
      - name: the addons stay within the glibc ceiling
        run: ./scripts/check-addon-glibc.py microvms-js
      # One publish. OIDC mints the credential and npm generates the provenance attestation
      # automatically, because this is a public package from a public repository — the
      # `--provenance` flag is not needed, and `publishConfig` deliberately does not set it,
      # since that would break a publish from anywhere without an OIDC identity.
      - name: publish
        working-directory: microvms-js
        run: npm publish --access public

  # ── the daemon, and the attestation crates.io cannot give ────────────────
  #
  # `agentd` is `publish = false` and reaches a consumer as this binary, so the GitHub
  # release is its distribution channel. The attestation is also how the crates.io half of
  # this workflow gets provenance at all: PyPI produces PEP 740 attestations and npm produces
  # SLSA provenance, both automatically, and crates.io supports neither.
  github-release:
    name: attest and publish the daemon binary
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and uploads the asset
      id-token: write # signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      # The shipping target: every MicroVM is ARM64, and a static binary is what lets the
      # daemon bake into a task's own base image with no interpreter and no dynamic loader.
      - name: build the daemon
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p agentd --target aarch64-unknown-linux-musl --locked
      - name: report size and linkage
        run: |
          ls -l target/aarch64-unknown-linux-musl/release/agentd
          file target/aarch64-unknown-linux-musl/release/agentd
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: target/aarch64-unknown-linux-musl/release/agentd
      # The attestation the step above produces lives in the repository's
      # attestation store, which `gh attestation verify` reads and nothing on
      # the release page shows. These two assets are the same material, on the
      # release itself: the Sigstore bundle whole, and the DSSE envelope from
      # inside it — which IS the signed in-toto SLSA provenance statement, in
      # the `.intoto.jsonl` spelling provenance tooling (and Scorecard's
      # Signed-Releases check) looks for beside an artifact. `agentd` keeps its
      # bare asset name because the README's `--pattern agentd` download is a
      # literal glob that must keep matching exactly one asset.
      - name: put the signature and provenance beside the binary
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" agentd.sigstore.json
          jq -c .dsseEnvelope agentd.sigstore.json > agentd.intoto.jsonl
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          --title ${{ github.ref_name }}
          --generate-notes
          --verify-tag
          target/aarch64-unknown-linux-musl/release/agentd#agentd-aarch64-unknown-linux-musl
          agentd.sigstore.json
          agentd.intoto.jsonl
