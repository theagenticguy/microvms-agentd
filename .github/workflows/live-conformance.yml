name: live conformance

# Manual only, and deliberately so. This workflow launches real MicroVMs in a
# real account: it costs money, it takes about fifteen minutes, and it needs
# credentials that can create IAM roles. None of that belongs on a push trigger.
#
# The `environment:` below is the actual gate. Configure it in repository settings
# with a required reviewer, and no fork, no bot, and no compromised token can
# spend money here without a human approving the run.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region (must be a Lambda MicroVMs region)"
        required: true
        default: us-east-1
        type: choice
        options: [us-east-1, us-west-2]
      destroy_after:
        description: "Destroy the Terraform stack when finished"
        required: true
        default: true
        type: boolean

# One at a time. Two concurrent runs would race on the same Terraform state and
# on the same account, and the loser would report failures that are really
# collisions.
concurrency:
  group: live-conformance
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for OIDC; no long-lived key is stored

jobs:
  live:
    name: real AWS
    runs-on: ubuntu-latest
    environment: live-aws
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        # rust-toolchain.toml declares the aarch64-musl target, so it installs
        # without a step here.

      - uses: Swatinem/rust-cache@v2
      # Every `uses:` here is on a Node 24 major, for the reason `ci.yml`'s header
      # paragraph gives — including `configure-aws-credentials@v6`, whose rolling
      # v6 tag landed on node24 (checked against the tag's action.yml, 2026-08-09).
      - uses: astral-sh/setup-uv@v7
        with:
          # See `ci.yml`'s `security` job: `conformance/run_rs.py` and
          # `scripts/check-live-rates.py` are PEP 723 scripts carrying their own
          # dependencies, so there is no lockfile a cache key could watch and
          # `auto` warns rather than caching.
          enable-cache: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # OIDC rather than a stored access key: the credentials exist for the life
      # of this job and cannot be exfiltrated from a log for later use. The role
      # needs to create MicroVM images, run MicroVMs, and manage the conformance
      # stack's bucket and roles.
      - name: assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.LIVE_CONFORMANCE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: build the shipping binary
        run: cargo build --release -p agentd --target aarch64-unknown-linux-musl

      # The host-architecture CLI, which is the client the suite drives. NOT the
      # aarch64 target above: the daemon cross-compiles because it runs inside the
      # guest, and a CLI built for the guest's architecture could not execute on
      # this runner.
      - name: build the microvm CLI
        run: cargo build --release -p microvms-cli

      - name: apply the conformance stack
        env:
          AWS_REGION: ${{ inputs.region }}
        run: |
          terraform -chdir=conformance/infra init -input=false
          terraform -chdir=conformance/infra apply -auto-approve -input=false

      # The Python oracle (`conformance/run.py`) and the standalone suspend/resume
      # probe ran here until the Rust port went live-green on the same commit; both
      # are in git history now, and this suite carries the suspend/resume assertions
      # they fed. It reports the 34 checks it cannot express as SKIP rather than
      # letting them go quiet.
      - name: conformance suite
        env:
          AWS_REGION: ${{ inputs.region }}
        run: |
          ./conformance/run_rs.py \
            --binary target/aarch64-unknown-linux-musl/release/agentd \
            --microvm-binary target/release/microvm

      # Free, creates nothing, and the only thing here that can tell you a price
      # this repo publishes has gone wrong. Runs after the suite so a rate that
      # moved does not stop the account from being torn down.
      - name: pinned rates match the Pricing API
        env:
          AWS_REGION: ${{ inputs.region }}
        run: ./scripts/check-live-rates.py

      # `if: always()` on both cleanup steps: a failed suite is exactly when
      # resources are most likely to survive, so cleanup must not be skipped by
      # the failure that made it necessary.
      - name: verify nothing leaked
        if: always()
        env:
          AWS_REGION: ${{ inputs.region }}
        run: ./scripts/verify-clean.py

      - name: destroy the stack
        if: always() && inputs.destroy_after
        env:
          AWS_REGION: ${{ inputs.region }}
        run: terraform -chdir=conformance/infra destroy -auto-approve

      # Re-checked after the destroy, because "terraform destroy succeeded" and
      # "the account is clean" are different claims — six service-created log
      # groups once survived a successful destroy.
      - name: verify again after destroy
        if: always() && inputs.destroy_after
        env:
          AWS_REGION: ${{ inputs.region }}
        run: ./scripts/verify-clean.py
