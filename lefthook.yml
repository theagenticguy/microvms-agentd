# Git hooks via lefthook, managed through mise.
#
# Install once per clone: `mise run install`.
#
# Everything goes through `mise run` so the mise-pinned tool versions are used
# rather than whatever happens to be on PATH. The full gate is `mise run check`;
# hooks exist to catch the cheap failures before they reach a reviewer.
#
# What is deliberately NOT here: the live AWS suites. They create billable
# MicroVMs and take about fifteen minutes, and a hook that spends money on every
# push is a hook people disable with --no-verify — which then also skips the
# checks that were worth having. Run `mise run live` deliberately, or dispatch the
# live-conformance workflow.

pre-commit:
  parallel: true
  jobs:
    - name: format
      run: mise run lint
      # Only when Rust or Python actually changed; a docs-only commit should not
      # pay for a clippy pass.
      glob: "*.{rs,py,toml,tf}"

    - name: secrets
      # Staged changes only — the fast scan for the thing a commit can newly
      # introduce. The full-history scan lives in `mise run security` (and CI),
      # because history does not change on commit.
      run: betterleaks git . --staged

    - name: license headers
      run: ./scripts/check-license-headers.py
      glob: "*.{rs,py,pyi,mjs,sh,tf}"

    - name: dependency licenses
      # deny.toml's allowlist against the resolved graph. Only when the graph
      # can change: a commit that touches no manifest cannot alter a license.
      # Through `mise exec` like everything else here — a hook's PATH has no
      # cargo, which is the exact failure this file's header warns about, and
      # this hook demonstrated it on its own first run.
      run: mise exec -- cargo deny check licenses bans sources
      glob: "{Cargo.toml,Cargo.lock,*/Cargo.toml,deny.toml}"

    - name: workflow lint
      run: mise exec -- actionlint
      glob: ".github/workflows/*.yml"

pre-push:
  # Sequential: the point is to fail on the first cheap gate rather than to make
  # a fast green run faster.
  piped: true
  jobs:
    - name: local gate
      # `check` is lint + the whole Rust test suite + schema freshness + the
      # service-model drift gate + the aarch64 cross-compile. Around forty seconds
      # warm, and it catches the great majority of what would otherwise fail in CI.
      run: mise run check

    - name: live-suite staleness
      # Advisory, never blocking. The local tiers cannot see a platform change:
      # every AWS-facing defect this project has hit was invisible until a real
      # run. So if the daemon changed since the last live run, say so — and let
      # the human decide, because only they know whether the change could touch
      # the platform boundary.
      #
      # The path list grew `microvms-core` and `microvms-cli` when the Rust client
      # landed, and those two matter more here than the deleted Python client's
      # paths did rather than less: `microvms-core` owns every control-plane call
      # and every trap guard, and its whole test suite runs through an injected
      # seam — so a change to the real AWS path is exactly the change no local
      # tier can see. Leaving them out would have made this note quietest about
      # the newest code. The Python client's path came off the list with the client.
      #
      # `git rev-parse --git-path` rather than the literal `.git/`, matching the writer in
      # `mise.toml`. In a worktree `.git` is a file, so the literal names a path inside a
      # non-directory: the writer failed outright there, and this reader would have taken
      # the "no live run recorded" branch forever — the quieter failure of the two, and the
      # worse one, because the note it prints is indistinguishable from the truth.
      run: |
        marker=$(git rev-parse --git-path agentd-last-live-run)
        if [ ! -f "$marker" ]; then
          echo "note: no live AWS run recorded in this clone."
          echo "      \`mise run live\` before merging anything that touches the"
          echo "      platform boundary — hooks, bootstrap, image build, identity."
          exit 0
        fi
        changed=$(git diff --name-only "$(cat "$marker")" HEAD -- agentd/src microvms-core/src microvms-cli/src conformance 2>/dev/null | head -5)
        if [ -n "$changed" ]; then
          echo "note: the daemon or its clients changed since the last live run:"
          echo "$changed" | sed 's/^/        /'
          echo "      consider \`mise run live\` (billable, ~15 min)."
        fi
        exit 0
