[workspace]
members = [
    "agentd",
    "microvms-cli",
    "microvms-core",
    "microvms-js",
    "microvms-py",
    "model",
    "protocol",
]
resolver = "3"
# Its own workspace, because cargo-fuzz builds it with sanitizer flags and a
# nightly toolchain that must not leak into the shipping graph. It carries its
# own lockfile for the same reason.
exclude = ["agentd/fuzz"]

# The daemon crate lands here as `agentd/` once the model settles. Keeping the
# workspace in place from the first commit means adding it is a one-line change
# rather than a restructure.
#
# The list is complete rather than grown: `microvms-core`, `microvms-cli`,
# `microvms-py`, and `microvms-js` are stubs whose owning tasks fill them in, and
# declaring them all at once means no later change has to touch this file. A member
# added late is a member every other in-flight branch conflicts on.

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/theagenticguy/microvms-agentd"
# Default-deny, and an allowlist rather than a denylist for the same reason
# `microvms-cli/tests/thinness.rs` gives: a denylist is defeated by the crate
# nobody thought to write down. A member added later is unpublishable until
# someone says otherwise in its own manifest, next to the reason.
#
# The three that opt in with `publish = true` are `microvms-protocol`,
# `microvms-core`, and `microvms-cli`. The four that stay here are each a
# deliberate absence: `agentd` and `agentd-model` because the daemon ships as a
# binary baked into an image and the model is a proof harness, `microvms-py` and
# `microvms-js` because their registry is PyPI and npm.
publish = false

# Tuned for the shipping artifact: one static binary, small enough to bake into
# any task base image, with no interpreter or runtime dependency.
[profile.release]
lto = true
codegen-units = 1
# `unwind`, deliberately, reversing an earlier `panic = "abort"`.
#
# `abort` is the right default for most small binaries — it drops the landing pads
# and shrinks the artifact. It is wrong here, and quietly so. The daemon is the only
# channel into the VM: no SSH, no supervisor, no console, and nothing inside that
# will restart a dead process. Under `abort`, one panicking request handler kills the
# whole daemon and the VM is unreachable forever with whatever work was in it.
#
# It also silently defeats two guards that only exist because of that. `tower_http`'s
# `CatchPanicLayer` is implemented with `catch_unwind`, which never runs when a panic
# aborts, and the poisoned-lock recovery in `state.rs` presumes a panic unwinds far
# enough to poison a lock rather than taking the process with it. Both would compile,
# both would pass their tests (the test profile unwinds), and both would be dead code
# in the shipped binary — which is the worst of the available outcomes, because the
# tests would report the guard as working.
#
# The cost is a modestly larger binary. That is a fine trade against an unrecoverable
# VM.
panic = "unwind"
strip = true
opt-level = "z"
