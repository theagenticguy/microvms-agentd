# The command surface for this repo. `mise run check` is the definition of done.
#
# Two tiers, split by cost rather than by kind:
#
#   mise run check   every local gate. No network, no AWS, no money. ~40s.
#   mise run live    the suites that talk to real AWS. Billable, ~15 min.
#
# `live` is never wired to a hook or to push. It creates real MicroVMs in the
# caller's account, and a gate that spends money on every push is a gate people
# disable. It is a deliberate command and a manual CI dispatch.

[tools]
# `rust = "stable"` makes mise provide the toolchain via rustup, which then honors
# `rust-toolchain.toml` — and that file is the only place that can declare the
# cross-compile *targets*. Pinning an exact version here instead (we tried 1.97)
# gives a compiler with no `aarch64-unknown-linux-musl`, so the build fails with
# "can't find crate for `std`" and a suggestion naming a toolchain the reader did
# not know they were using. Removing the entry entirely is worse: cargo then
# leaves mise's PATH and every task fails with "command not found".
rust = "stable"
uv = "latest"
ruff = "latest"
semgrep = "latest"
betterleaks = "latest"
syft = "latest"
grype = "latest"
trivy = "latest"
osv-scanner = "latest"
terraform = "latest"
lefthook = "latest"
node = "24"
"cargo:cargo-deny" = "latest"
"aqua:rhysd/actionlint" = "latest"

[env]
# The shipping target. MicroVMs are ARM64-only, and a static binary is what lets
# the daemon bake into any task image without depending on an interpreter or libc
# that image may not have. Linker choice lives in .cargo/config.toml.
AGENTD_TARGET = "aarch64-unknown-linux-musl"

# ── local gates ─────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Format everything (writes)"
# `ruff format .` rather than a path list, and the whole repo rather than four named
# directories, because `ruff.toml` now carries the discovery. See `[tasks.lint]` below for the
# trap that made the list necessary and the `.py` rename that retired it — this line has to
# stay the same shape as the `--check` one there, or `fmt` would leave work for `lint` to
# find.
run = [
  "cargo fmt --all",
  "ruff format .",
  "terraform -chdir=conformance/infra fmt",
]

[tasks.lint]
description = "Format check + clippy + ruff, no writes"
# `ruff check .` and `ruff format --check .`, one path each, because the file selection now
# lives in `ruff.toml` where a config can be reasoned about — and because this line spent its
# whole life not linting most of the repo.
#
# ruff discovers files by **extension** when it walks a directory, and every gate in
# `scripts/` *used to be* an extensionless PEP 723 script. So `ruff check scripts` reported
# "No Python files found under the given path(s)" as a *warning* and exited 0: measured, the
# two ruff lines here were reading `conformance/run_rs.py` and nothing else, for as long as
# they had existed. That is a gate passing over an empty set, which is the failure mode
# `check-model-drift`'s own header warns about, and it was hiding real findings — naming one
# script explicitly surfaced F401s in it immediately.
#
# Two fixes were tried, and the second is why this comment is shorter than it was. Naming each
# script here worked for exactly the files someone remembered. `ruff.toml`'s
# `extend-include = ["scripts/*"]` was structural but taught only ruff — the same blindness
# then turned up in `check-license-headers.py`, which at the time enumerated only
# `git ls-files "*.rs" "*.py"` (it covers six extensions now)
# and so had never seen the scripts either (issue #32). The gates are now named
# `scripts/*.py`, which every extension-based enumerator in this repo already understands, and
# `extend-include` is gone. They keep their shebangs and their executable bit, so
# `./scripts/check-model-drift.py` is still a direct invocation.
#
# `./scripts/check-lint-coverage.py` is the guard over that, and it is a separate gate on
# purpose: `ruff check .` would still print "All checks passed!" over nothing. It compares
# ruff's own `--show-files` answer against every tracked file that is Python by extension
# **or by shebang**, and names any shortfall. That shebang half is what enforces the rename
# rather than merely recommending it: a new extensionless script under `scripts/` is reported
# by name as unlinted, measured. Offline, free, milliseconds. Proven able to fail by pointing
# it at an empty directory, which is the original defect reproduced deliberately.
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
  "./scripts/check-lint-coverage.py",
  "ruff check .",
  "ruff format --check .",
  "terraform -chdir=conformance/infra fmt -check",
]

[tasks.security]
description = "Semgrep + secrets + license headers + dependency licenses + workflow lint"
# Five checks, one exit. Semgrep runs the public rust and secrets rulesets over
# shipped source only (test fixtures plant fake tokens on purpose). betterleaks
# scans the whole git history, not just the tree — a secret that was committed
# and then deleted is published the moment the repo is. The header check is a
# closed set over tracked sources, so an unlicensed file cannot land quietly.
# cargo-deny is the dependency-license policy (deny.toml: measured allowlist,
# yanked crates, untrusted registries) — `mise run vuln` covers CVEs, this
# covers what a CVE scanner cannot. actionlint is the only linter that reads
# the workflows; before it, a workflow mistake was found by the workflow
# misbehaving.
run = [
  # --severity WARNING drops the INFO tier: its findings here are std::env::args
  # in a CLI and TempDir in tests — idioms, not defects — and a gate that cries
  # wolf gets --no-verify'd. WARNING and ERROR still fail the run.
  "semgrep scan --config p/rust --config p/secrets --severity WARNING --severity ERROR --error --quiet --metrics=off protocol/src agentd/src model/src microvms-core/src microvms-cli/src microvms-py/src microvms-js/src",
  "betterleaks git .",
  "./scripts/check-license-headers.py",
  "cargo deny check",
  "actionlint",
]

[tasks.sbom]
description = "CycloneDX + SPDX SBOMs into sbom/ (gitignored; CI publishes them as artifacts)"
# Excludes are the difference between an SBOM of what ships and an inventory of
# the workshop: .terraform/ holds a vendored Go provider binary (402 modules of
# someone else's dependency tree), target/ and node_modules/ are build output.
run = """
mkdir -p sbom
syft . --exclude './conformance/infra/.terraform/**' --exclude './target/**' --exclude './microvms-js/node_modules/**' \
  --exclude './site/node_modules/**' --exclude './site/dist/**' \
  -o cyclonedx-json=sbom/microvms-agentd.cdx.json \
  -o spdx-json=sbom/microvms-agentd.spdx.json -q
"""

[tasks.vuln]
description = "Grype + trivy + osv-scanner over the tree and the fresh SBOM"
depends = ["sbom"]
# Three scanners because their databases disagree at the margins and each has a
# lane the others lack: grype reads the SBOM (so it audits what we publish),
# trivy adds IaC misconfig and its own secret pass over the tree, osv-scanner
# reads the lockfiles against OSV directly. Every accepted finding lives in
# .trivyignore.yaml / osv-scanner.toml WITH its reason — an ignore without a
# reason is a finding someone silenced.
run = [
  "grype sbom:sbom/microvms-agentd.cdx.json --fail-on high -q",
  "trivy fs --scanners vuln,misconfig,secret --skip-dirs conformance/infra/.terraform --skip-dirs target --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml -q .",
  "osv-scanner scan source -r .",
]

[tasks.test]
description = "All six Rust tiers: unit, model, proptest, turmoil, panic, schema"
run = "cargo test --all"

# `test:python` was here: 83 client-library tests against a fake daemon over a real
# loopback socket. The Python tier moved to git history after the Rust port went
# live-green — both suites passed against real AWS on the same commit (Python oracle
# 56/56, Rust CLI 38/38), which is what made the oracle's job finished rather than
# merely duplicated. The Python left in the tree is tooling and binding tests, not a client:
# `conformance/run_rs.py` drives the Rust CLI, the six `scripts/` gates read botocore's model,
# the Pricing API, the account, and the pyo3 surface, and `microvms-py/tests` covers the
# bindings (run in CI against a built wheel, not here — it needs `maturin develop`).
#
# Every one of them is linted by `fmt` and `lint`, which is newly true rather than restated:
# eighteen files are what `ruff.toml` reaches now, against the one file the two ruff lines
# used to see. `./scripts/check-lint-coverage.py` prints the count on every run, which is what
# keeps this number from drifting the way the live-suite counts above did.

[tasks.schema]
description = "Regenerate docs/schema.json from the serde types"
run = "cargo run -q -p agentd --bin schema"

[tasks."schema:check"]
description = "Fail if the committed schema no longer matches what is served"
# A stale generated artifact is worse than none: consumers trust it *because* it
# is generated, and a diff never reveals that it describes a protocol nobody
# serves.
run = "cargo run -q -p agentd --bin schema -- --check"

[tasks.stubs]
description = "Regenerate microvms-py/microvms.pyi from the pyo3 surface"
run = "./scripts/generate-py-stubs.py"

[tasks."stubs:check"]
description = "Fail if the committed Python stub no longer matches the pyo3 surface"
# `schema:check`'s argument, pointed at the binding rather than at the wire.
#
# The stale case is *worse* here than it is for the schema, because `py.typed` ships in the
# wheel beside the stub. That marker is a promise to a type checker that this package is
# typed, so a stub describing a surface the crate no longer has does not degrade to
# "unchecked" — it degrades to confidently wrong, approving in an editor a call that raises
# `AttributeError` when it runs. The crate shipped no stub and no marker at all until this
# landed, which is why the gate arrives in the same commit as the artifact rather than after
# it.
#
# In `check` rather than left to CI, for the reason `model:check` gives: no network, no
# credentials, no money, so it costs what a lint costs. It does build `microvms-py` twice —
# once for maturin's introspection pass, once for the importable cdylib the exception
# hierarchy is read out of — and both are incremental builds `test` has already warmed.
run = "./scripts/generate-py-stubs.py --check"

[tasks.spec]
description = "agentd.symspec.json consistency via symspec 0.1.0 + Z3"
# Covers `spec/agentd.symspec.json` ONLY — six draft requirements about the daemon's
# bootstrap and control-token rules. It is not the whole spec surface: `spec/core.symspec.json`
# is 51 requirements in the v5 `docVersion: 3` format, and the 0.1.0 `symspec` on PATH
# cannot read it at all — no state model, no effects/constraints, no reachability tier.
# That one is `spec:core`.
#
# Not in `check`'s dependency list: symspec is a global npm install plus a
# downloaded embedding model, so a fresh clone should not fail on its absence.
run = "symspec check spec/agentd.symspec.json --strict"

[tasks."spec:core"]
description = "microvms-core's 51 requirements: contradictions, coverage, and reachability"
# The v5 CLI by absolute path, not the `symspec` on PATH. That one is 0.1.0 and predates
# everything this document depends on: `core.symspec.json` carries a state model (5
# variables), 7 effects, and 3 constraints, and the tier that proves the constraints hold
# over *unbounded* runs is the reachability tier 0.1.0 does not have. Pointed at the wrong
# binary this does not fail loudly — it parses less and reports on less.
#
# `--reachability-timeout-ms 5000` rather than leaving it to inherit `--timeout-ms`, and the
# flag's own help says why: Z3's cancellation is cooperative, so an unbounded reachability
# query is an *uncancellable* one. This bound IS the cancellability mechanism, and 5s is
# comfortably above the 794ms the three constraints actually take.
#
# Out of `check`'s depends for the same reason `spec` is out: this needs a node path in
# someone's home directory. A gate that fails on a fresh clone is a gate people learn to
# skip, and `check` is the one command that must never be skipped. Verified 2026-08-08:
# 0 error findings, 202 warn / 56 info, 3 constraints proved under hypotheses, 0 violated,
# 0 unknown.
run = "node ~/workplace/symspec/packages/symspec/dist/cli.mjs check spec/core.symspec.json --reachability-timeout-ms 5000"

[tasks."model:check"]
description = "Fail if a hardcoded API constraint no longer matches botocore's service model"
# Same argument as `schema:check`, pointed the other way. That one asserts the
# generated artifact still describes what we serve; this one asserts the constants we
# wrote by hand still describe what AWS accepts. Both exist because a value nobody
# can disagree with drifts silently: this project published a 16 KB `runHookPayload`
# ceiling through several review passes against a model that says 4096.
#
# In `check` rather than `live` because the model is a file inside botocore — no
# network, no credentials, no money — so it costs the same as a lint and belongs
# where the gate is unconditional.
#
# TRAP-12's "verify each hardcoded service constraint against the pinned botocore service
# model in the build gate": `microvms-core`'s constants, read through
# `microvm constants --emit-json`, against the shipped model.
#
# It compared THREE ways while the Python client existed — each client against the model,
# then the two against each other. `MICROVM_REGIONS` and the sizing table are
# measurement-backed, so the model can say nothing about them and client-vs-client was the
# only check they could ever have. The script now holds its own pinned copies of those two
# and compares against them, which keeps a second reader for the two values that need one.
#
# No `depends = ["build-cli"]`, because the script reaches the Rust constants through
# `cargo run -q -p microvms-cli` itself. A prebuilt path would be faster and can be *stale*,
# and a stale constants dump is precisely this gate's failure mode — it would compare a
# value nobody ships and report agreement. Measured 2026-08-08: 0.4s warm, against 0.006s
# for the built binary, which is nothing beside the rest of `check`. `--rust-binary` exists
# for anyone who wants that trade knowingly.
run = "./scripts/check-model-drift.py"

[tasks.build]
description = "Release build for the shipping target"
run = "cargo build --release -p agentd --target $AGENTD_TARGET"

[tasks."build:cli"]
description = "Release build of the `microvm` CLI, for the host"
# NOT `$AGENTD_TARGET`. The daemon cross-compiles to aarch64-musl because it runs *inside*
# the guest; the CLI runs on the operator's machine, so building it for the guest's
# architecture would produce a binary that cannot execute here. Two different answers to
# "which target", because they are two different questions.
#
# Out of `check`'s depends: `cargo clippy --all-targets` in `lint` and `cargo test --all` in
# `test` already compile this crate, so a third build would add ~30s to the gate to produce
# an artifact only the live tier consumes.
run = "cargo build --release -p microvms-cli"

[tasks."publish:check"]
description = "The publish set is the intended one and every manifest can upload. Offline"
# In `check` because it costs a `cargo metadata` and catches the class of defect that is
# otherwise found by a release tag: `cargo publish` requires `description`, `license`, a
# `readme` file that exists, keywords within crates.io's limits, and a `version` on every
# path dependency, and nothing in `build`, `test`, or `lint` reads any of that. A tag is the
# worst place to learn it, because crates.io versions are immutable — there is no second
# `0.1.0`.
#
# It also asserts the publish set by equality, so a crate that quietly becomes publishable
# fails here. `agentd` and `agentd-model` are `publish = false` on purpose and a diff that
# flips either one has to say so.
run = "./scripts/check-publishable.py"

[tasks."release:tag"]
description = "Create and push a release tag, refusing a reused or stale one. THE way to release"
# `git tag` is not idempotent and its failure is not fatal to a shell sequence: a leftover local
# `v0.1.0` from three weeks earlier made `git tag -a v0.1.0` fail while the following
# `git push origin v0.1.0` succeeded, pushing the OLD tag at a commit predating the crate rename
# and the release workflow. No CI check separates that from a real release — an ancestry test
# passes an old commit on main, and the tag-versus-manifest check passes it too, because every
# version here read `0.1.0` for weeks.
#
# So the control is here, before the tag exists: no reuse local or remote, a clean tree, HEAD at
# main's tip, and `publish:check` against the tag.
run = "./scripts/release-tag.sh"

[tasks."npm:check"]
description = "The npm package's loader and glibc floor. Needs a built addon"
# Out of `check`, because both gates read build artifacts rather than sources: `index.js` and
# the `.node` files are generated by `napi build` and gitignored, so on a fresh clone there is
# nothing to assert over and a gate that passes on absence is worse than no gate.
#
# `--all-platforms` is deliberately absent here. One `napi build` produces one triple, which is
# what a developer has locally; the release job adds the flag because that is the only place
# all four exist. `ci.yml`'s bindings job runs this same pair.
run = [
  "./scripts/check-npm-loader.py",
  "./scripts/check-addon-glibc.py microvms-js",
]

[tasks."publish:dry-run"]
description = "Package and verify every publishable crate as if the others were released"
# NOT in `check`, and not for the usual reason. This is the strongest gate in the repo for
# release readiness and it needs the network: `cargo publish --workspace --dry-run` resolves
# against the registry, so `--offline` fails outright with "attempting to make an HTTP
# request". `check` is offline and free, which is what makes it runnable on a plane and
# therefore runnable at all — so this runs in `ci.yml`, beside the other network tiers.
#
# `--workspace` publishes in dependency order (Cargo 1.90+) and verifies the whole set as
# one build, which is the only way the `microvms-core -> microvms-protocol` edge gets checked
# the way a consumer will resolve it rather than through the path dependency.
#
# Needs a COMMITTED tree. `cargo publish` refuses while any tracked file differs from HEAD —
# staged is still dirty — because packaging uncommitted work verifies something that is not in
# the repository. That is invisible in CI, where the checkout is clean by construction, and it
# is the first thing this hits when run from a working branch.
run = "./scripts/check-publishable.py --dry-run"

[tasks."live:check"]
description = "Fail if the live tier's own wiring is wrong. Offline and free"
# In `check` rather than `live` for the reason `model:check` gives: no network, no
# credentials, no money, so it costs the same as a lint. It is also the one gate whose
# subject is *this file*, which nothing checked — and a 228-second billable run on
# 2026-08-15 found three defects in it, none of them in anything the suite tests: a leak
# check that reported clean at t=5s before the suite created anything, a free rate check
# racing the billable suite it could abort, and a marker write that failed outright in a
# worktree. All three are cheap to assert offline and expensive to find any other way.
#
# `live:` prefixed but deliberately NOT in `live`'s own dependency list: a guard over the
# tier's wiring belongs in the gate that runs every time, not in the tier it describes,
# which runs when someone decides to spend money.
run = "./scripts/check-live-wiring.py"

[tasks.check]
description = "The full local gate — the definition of done"
depends = [
  "lint",
  "security",
  "test",
  "schema:check",
  "stubs:check",
  "model:check",
  "publish:check",
  "live:check",
  "build",
]

# ── live AWS suites (billable, manual) ──────────────────────────────────────

[tasks."live:infra"]
description = "Apply the conformance stack (idempotent)"
run = "terraform -chdir=conformance/infra init -input=false && terraform -chdir=conformance/infra apply -auto-approve -input=false"

# `live:conformance` was here: 56 checks through `conformance/run.py` and the Python
# client. The Python tier moved to git history after the Rust port went live-green — both
# suites passed against real AWS on the same commit, which is what retired the oracle
# rather than merely duplicating it. `live:conformance-rs` below is the live suite now,
# and it says in its own description how much of the 56 it can express.
#
# `live:probe` went the same way: `conformance/probe_suspend_resume.py` measured what a
# real suspend/resume cycle preserves, and its measurements live on in
# `docs/PLATFORM.md`, "Suspend and resume preserve everything". The suspend/resume
# *assertions* it fed are still run, by `live:conformance-rs`'s own suspend/resume
# section — the ticker gap, the surviving token, the surviving filesystem, the
# backgrounded process still counting. What is gone is the standalone probe that
# discovered them.

[tasks."live:conformance-rs"]
description = "The live suite through the Rust client: all 105 checks, no SKIP"
depends = ["build", "build:cli", "live:infra"]
# Both binaries: `--binary` is the aarch64 daemon that gets baked into the image, and
# `--microvm-binary` is the host-architecture CLI under test. Naming both is what makes the
# two-target split above visible at the call site rather than only in a comment.
#
# This description read "38 of the oracle's 56 checks" for a release, and the number was in
# it on purpose: the CLI's `exec` was one-shot with a generated exec id and there was no
# `microvm cp`, `ack`, `exec --stream`, or `stdin`, so file transfer, tar round trips, the
# four hostile archives, SSE, the stdin lifecycle, and the health flags were not expressible
# through this client. The suite printed each of the 34 as SKIP with the missing subcommand
# named, and a description claiming 56 would have been the more comfortable lie.
#
# `docs/CLI-COVERAGE-PLAN.md` grew the five doors — `health`, exec identity
# (`--exec-id`/`--poll`), `ack`, `cp` (+`--tar`), `--stream`, `stdin` — and every SKIP became
# a real check under the name run.py gave it. 75 rather than 72 because two of the old 38
# were weak readings off the launch envelope and are now asserted directly against
# `microvm health`; the suite's own docstring names all three deltas.
#
# The number stays in the description for the same reason it did when it was 38: this task's
# one line is where someone decides whether to trust the tier, and "the live suite" without
# a count is a sentence that stays true while coverage shrinks.
run = """
./conformance/run_rs.py \
  --binary target/$AGENTD_TARGET/release/agentd \
  --microvm-binary target/release/microvm
"""

[tasks."live:paths"]
description = "The cursor encoding and the colon image ARN, against the real signer. Free."
# Read-only and free — four GETs over resources the account already holds — but it needs
# credentials, so it belongs here rather than in `check` for the reason `live:rates` gives
# at length.
#
# It exists because every other test of the pagination cursor goes through the injected
# `Transport`, so the fake mints the token the loop reads back and `SignedTransport` plus
# the SigV4 canonical query are never exercised. That gap is not academic: measured
# 2026-08-15, a cursor sent with its `=` padding unencoded is refused **400
# `{"message":null}`** — a blank parse failure on page two of a listing whose page one
# worked, naming nothing. The tests are `#[ignore]` so a credential-less
# `cargo test --workspace` stays green; this task is how they run.
run = "cargo test -p microvms-core --test live_pagination -- --ignored --nocapture"

[tasks."live:versions"]
description = "The four version/build operations against the real service. Costs one short VM."
# Same argument `live:paths` makes, plus two things a fake structurally cannot hold.
#
# `UpdateMicrovmImageVersion` is the only `PATCH` this client sends, so `Method::Patch` reaching
# the SigV4 canonical request correctly is unexercised until a real signature is computed over
# one — and a method the enum spells and the signer signs differently is refused in a way that
# reads like bad credentials.
#
# And `INACTIVE` is only a retire if the *service* enforces it. A readback saying `INACTIVE` is
# the service echoing a field back; the property the whole feature rests on is that `RunMicrovm`
# then refuses, which nothing but the service can demonstrate. Measured 2026-08-16: it answers
# **404 `No active version found for MicroVM image <arn> and version 1.0`**, for a pinned launch
# and an unpinned one alike.
#
# NOT free, unlike `live:paths`, and the description says so because the cost is the reason
# someone might not run it: the ACTIVE half of the round trip launches a real VM and terminates
# it on the next line, about ten seconds of a 2 GB baseline. There is no cheaper way — a
# `RunMicrovm` with the execution role omitted **succeeds** (the member is optional in the model
# and the service means it, measured 2026-08-16 at the cost of one leaked VM), so there is no
# incomplete launch that fails locally the way the bogus-ARN technique gives for other members.
#
# `--test-threads=1` because one of the four tests flips a version's status and restores it, and
# a sibling reading the same version in parallel would see whichever half it happened to catch.
# Ordered after `live:paths` in the aggregate below for the same reason `live:rates` goes after
# the suite: this one spends money, so the free checks report first.
run = "cargo test -p microvms-core --test live_versions -- --ignored --nocapture --test-threads=1"

[tasks."live:rates"]
description = "Fail if the pinned rate table no longer matches the AWS Pricing API"
# The same argument as `schema:check`: a stale pinned artifact is worse than none,
# because a consumer trusts a price *because* it is pinned and no diff reveals that
# it describes a bill nobody pays. `STALE_AFTER_DAYS` could only say nobody had
# looked; this looks.
#
# In `live` rather than `check` despite costing nothing — the Pricing API is free
# and creates no resources — because it needs network and credentials, and `check`
# is defined by needing neither. A gate that fails on a plane without AWS creds is
# a gate people learn to skip, and `check` is the one command that must never be
# skipped.
#
# A standalone script rather than a module in a client, because it used to be the Python
# client's `pricing` module and that client is now git history. The pinned figures are
# inlined there as literals — a deliberate second copy of `microvms-core`'s
# `pinned_rates()`, since a drift check that imported the values it checks would compare
# a table against itself. `scripts/check-live-rates.py --twin-only` runs that cross-check
# alone, offline and free, and it also runs first on this path.
run = "./scripts/check-live-rates.py"

[tasks."live:verify-clean"]
description = "Ask the account what leaked, rather than trusting teardown"
# Independent of the code that did the cleanup, which is the whole point:
# `terraform destroy` once reported success while six service-created log groups
# survived, because Terraform never owned them.
#
# Ordering it *after* the suite is `live`'s job, not a `wait_for` here — see that task's
# body for why the sequencing had to move out of `depends` entirely. This task stays a
# plain one so `mise run live:verify-clean` remains the bare "what is in my account right
# now" question, which is what someone reaches for after an interrupted run.
run = "./scripts/verify-clean.py"

[tasks.live]
description = "Every live suite, then an independent leak check. BILLABLE."
# `live:rates` is in here even though it is the one member that spends nothing and
# creates nothing. It is the cheapest thing in the tier and the only one that can
# tell you a figure this repo publishes has gone wrong, so leaving it out of the
# aggregate would mean it only ever ran when someone remembered to name it.
#
# `live:conformance-rs` is in here rather than left to be remembered, which is the same
# argument `live:rates` earned above. Every AWS-facing defect this project has hit was
# invisible until a real run, and the Rust client's live paths have *never* had one — its 628
# tests all go through an injected seam, so `ControlPlane::new` and everything past it are
# unexercised against the real service. A suite that only runs when someone names it is a
# suite that runs the week it is written.
#
# Three members rather than five. `live:conformance` and `live:probe` drove the Python
# client, and the Python tier moved to git history after the Rust port went live-green:
# both suites passed against real AWS on the same commit, so the oracle's job was
# finished rather than duplicated. `live:conformance-rs` is now the whole of the live
# protocol coverage, and as of the CLI-coverage waves it expresses all 77 named checks
# with none skipped — the 34 it used to name as inexpressible are real checks against the
# five new attached subcommands.
# 77 rather than the 75 this line and the README carried until 2026-08-15. The count had
# already drifted to 76 without either being updated — a measured live run reported
# "76 of 76" against three places claiming 75 — and the log-group delete described in
# `drive_teardown` adds the 77th. The number is in these descriptions because this is
# where someone decides whether to trust the tier, so it is worth keeping right; that it
# drifted once is the argument for reading it off a run rather than from memory.
#
# Only the two builds and the stack in `depends`. The three suites are sequenced in the
# body below instead, and that is a correction rather than a style choice: measured
# 2026-08-15, `depends = ["live:rates", "live:conformance-rs", "live:verify-clean"]` ran all
# three **in parallel**, and each of the three orderings it produced was wrong.
#
#   `live:verify-clean` finished at t=5s of a 228-second run and printed "account
#   us-east-1: clean" — about an account nothing had touched yet. A leak check that
#   cannot have seen the leak is not a weak check, it is a false assurance, and it is
#   the one line a caller reads to decide whether to go looking.
#
#   `live:rates` raced the billable suite. mise kills the surviving siblings when one
#   member of a parallel set fails, so a rate drifting past the 0.5% tolerance — a free
#   check about a published figure — would have aborted the run that spends the money,
#   mid-flight, with a MicroVM up. The killed task gets a TERM and a shell trap fires,
#   but the VM here is launched by a Python driver two processes down.
#
#   And nothing ordered the marker write after the suites at all.
#
# mise has no `if: always()`. `depends_post` runs only when the task succeeds, and a
# `wait_for` chain stops dead at the first failure — both measured — so under either one
# the leak check is skipped exactly when the suite failed, which is precisely when
# resources survive. That is the reason this is a shell body with a trap: the trap is the
# only always-run primitive available, and `.github/workflows/live-conformance.yml` says
# the same thing with `if: always()` on both cleanup steps.
depends = ["build", "build:cli", "live:infra"]
# Order, and what each position buys:
#
# 1. the suite, first, because it is the billable one and nothing free should be able to
#    kill it. The stack it needs is already applied by `depends`.
# 2. `live:rates` after, so a drifted rate is reported once the VM is down. Same order
#    the CI workflow uses, for the reason it states: "runs after the suite so a rate that
#    moved does not stop the account from being torn down".
# 3. `live:verify-clean` in the trap, so it runs on the failure path too — an interrupted
#    or failed suite is the case where the account most needs asking.
# 4. the marker only on the success path, because it is a claim that this commit is
#    live-verified and a failed run does not support it. `set -e` above is what makes
#    that true by construction rather than by an `if`.
#
# Records the commit that was last proven against real AWS. The pre-push hook reads it to
# tell you whether the daemon has changed since — advisory only, because only a human knows
# whether a given change could touch the platform boundary. Lives in the git directory so
# it is per-clone and never committed: a marker claiming someone else's run is worse than
# no marker.
#
# The path comes from `scripts/live-marker-path` rather than the literal `.git/…`, because
# in a **worktree** `.git` is a *file* and the redirect fails with "Not a directory" —
# measured 2026-08-15, where a 228-second billable run ended `[live] ERROR task failed` on
# this line with all 76 checks green and the account clean. `mise run marker:check` is the
# offline guard over both repo shapes, and that script's docstring carries the rest.
run = """
set -e
# Idempotent, because the trap fires on the normal exit as well as on a failure and a
# double leak report reads like two leaks.
verified=0
verify_clean() {
  [ "$verified" = 1 ] && return 0
  verified=1
  echo '== independent leak check =='
  mise run live:verify-clean
}
trap verify_clean EXIT INT TERM

# Before the suite: free, read-only, seconds, and it is the member that fails first when
# a URL member's encoding is wrong, so a signing bug is reported as a signing bug rather
# than as a launch that could not resolve its image.
mise run live:paths
# After `live:paths` and before the suite. It writes — one version's status, flipped and
# restored — and it launches one short VM, so it goes after the free member and before the
# long one: a `PATCH` that will not sign should be reported in seconds rather than after a
# four-minute build. Its own restore is on every exit path, so a failure here leaves the
# version ACTIVE and the trap below still asks the account what leaked.
mise run live:versions
mise run live:conformance-rs
mise run live:rates
verify_clean

git rev-parse HEAD > "$(./scripts/check-live-wiring.py --marker-path)"
echo 'recorded this commit as live-verified'
"""

[tasks."live:destroy"]
description = "Tear down the conformance stack"
run = "terraform -chdir=conformance/infra destroy -auto-approve"

# ── setup ───────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install git hooks"
run = "lefthook install"

[tasks."install:cli"]
description = "Install the `microvm` binary into ~/.cargo/bin, so it runs bare"
# `--locked` so the installed binary is built against Cargo.lock, the same
# resolution every gate tested; a floating install could resolve newer
# dependency versions than anything in CI ever compiled.
run = "cargo install --path microvms-cli --locked"

# ── the documentation site ──────────────────────────────────────────────────
#
# `site/` publishes `docs/` to GitHub Pages, and the reason it is a build rather than a
# `docs/` directory someone browses on github.com is the machine surface: a raw `.md`
# twin per page, the three `llms.txt` bundles, per-page discovery links, and diagrams
# rendered to SVG at build time. An agent that scrapes rendered HTML pays for navigation
# chrome, a search widget, and a theme toggle to read three paragraphs.
#
# NOT in `check`'s dependency list, for the reason `spec` and `spec:core` are out: it
# needs a `pnpm install` on a fresh clone, and a gate that fails on a fresh clone is a
# gate people learn to skip. `docs:check` depends on the install so it works from cold;
# `.github/workflows/docs.yml` runs the same tiers on every push and pull request. Treat
# a green `mise run check` as saying nothing about the site.
#
# `site/src/content/docs/` is GENERATED in full and gitignored. Edit `docs/` for the
# published pages, or `site/authored/` for the landing page and the agent page; a change
# made in the content directory is discarded by the next sync with no diff to show for it.

[tasks."docs:install"]
description = "Install the docs site's dependencies (pnpm, into site/node_modules)"
dir = "site"
run = "pnpm install --frozen-lockfile"

[tasks."docs:sync"]
description = "Copy docs/ into the site's generated content directory and stamp frontmatter"
dir = "site"
# Reads `docs/` and never writes to it. Starlight requires a `title` in frontmatter and
# offers no H1 fallback, while ccu forbids frontmatter on its outputs and strips it — so
# the title is derived here and the tree stays read-only.
run = "node scripts/sync-docs.mjs"

[tasks."docs:braces"]
description = "Fail on a bare `{` outside a fence, which breaks the raw Markdown routes"
dir = "site"
depends = ["docs:sync"]
# The raw-twin builder parses every page through remark-mdx, where a brace opens a JSX
# expression, and the resulting build failure names neither the page nor the field. This
# names the file, line, and column in milliseconds. `## GET /v1/exec/{id}` is the shape
# it catches; backticks around the path are the only legal repair.
run = "node scripts/brace-gate.mjs src/content/docs"

[tasks."docs:build"]
description = "Build the site into site/dist (offline, free)"
dir = "site"
depends = ["docs:braces"]
# The build is itself three gates: starlight-links-validator fails it on a broken
# internal link, the citation rewriter fails it on a `path:line` that does not resolve at
# the pinned commit, and the mermaid plugin fails it on a diagram it cannot render rather
# than shipping the fence as a code block on a page that looks plausible.
run = "pnpm exec astro build"

[tasks."docs:test"]
description = "The dist/ probes: twins, discovery links, deep-link budget, cloaking, diagrams"
dir = "site"
# Reads the built output rather than the inputs, because the inputs are what you already
# believe: three of the four machine surfaces fail silently, and a check against a
# component's props passes while the emitted href is wrong.
run = "pnpm exec vitest run"

[tasks."docs:check"]
description = "The docs site's definition of done: install, gates, typecheck, build, probes"
depends = ["docs:install", "docs:build"]
dir = "site"
run = ["pnpm exec astro check", "pnpm exec vitest run"]

[tasks."docs:dev"]
description = "Serve the site locally with hot reload"
dir = "site"
depends = ["docs:braces"]
run = "pnpm exec astro dev"
