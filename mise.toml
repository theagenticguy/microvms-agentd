# The command surface for this repo. `mise run check` is the definition of done.
#
# Two tiers, split by cost rather than by kind:
#
#   mise run check   every local gate. No network, no AWS, no money. ~40s.
#   mise run live    the suites that talk to real AWS. Billable, ~15 min.
#
# `live` is never wired to a hook or to push. It creates real MicroVMs in the
# caller's account, and a gate that spends money on every push is a gate people
# disable. It is a deliberate command and a manual CI dispatch.

[tools]
# `rust = "stable"` makes mise provide the toolchain via rustup, which then honors
# `rust-toolchain.toml` — and that file is the only place that can declare the
# cross-compile *targets*. Pinning an exact version here instead (we tried 1.97)
# gives a compiler with no `aarch64-unknown-linux-musl`, so the build fails with
# "can't find crate for `std`" and a suggestion naming a toolchain the reader did
# not know they were using. Removing the entry entirely is worse: cargo then
# leaves mise's PATH and every task fails with "command not found".
rust = "stable"
uv = "latest"
ruff = "latest"
semgrep = "latest"
betterleaks = "latest"
terraform = "latest"
lefthook = "latest"
node = "22"

[env]
# The shipping target. MicroVMs are ARM64-only, and a static binary is what lets
# the daemon bake into any task image without depending on an interpreter or libc
# that image may not have. Linker choice lives in .cargo/config.toml.
AGENTD_TARGET = "aarch64-unknown-linux-musl"

# ── local gates ─────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Format everything (writes)"
run = [
  "cargo fmt --all",
  "ruff format conformance scripts",
  "terraform -chdir=conformance/infra fmt",
]

[tasks.lint]
description = "Format check + clippy + ruff, no writes"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
  "ruff check conformance scripts",
  "ruff format --check conformance scripts",
  "terraform -chdir=conformance/infra fmt -check",
]

[tasks.security]
description = "Semgrep + secret scan + license headers — fast, offline, no writes"
# Three checks, one exit. Semgrep runs the public rust and secrets rulesets over
# shipped source only (test fixtures plant fake tokens on purpose). betterleaks
# scans the whole git history, not just the tree — a secret that was committed
# and then deleted is published the moment the repo is. The header check is a
# closed set over tracked sources, so an unlicensed file cannot land quietly.
run = [
  # --severity WARNING drops the INFO tier: its findings here are std::env::args
  # in a CLI and TempDir in tests — idioms, not defects — and a gate that cries
  # wolf gets --no-verify'd. WARNING and ERROR still fail the run.
  "semgrep scan --config p/rust --config p/secrets --severity WARNING --severity ERROR --error --quiet --metrics=off protocol/src agentd/src model/src microvms-core/src microvms-cli/src microvms-py/src microvms-js/src",
  "betterleaks git .",
  "./scripts/check-license-headers",
]

[tasks.test]
description = "All six Rust tiers: unit, model, proptest, turmoil, panic, schema"
run = "cargo test --all"

# `test:python` was here: 83 client-library tests against a fake daemon over a real
# loopback socket. The Python tier moved to git history after the Rust port went
# live-green — both suites passed against real AWS on the same commit (Python oracle
# 56/56, Rust CLI 38/38), which is what made the oracle's job finished rather than
# merely duplicated. The two Python files left in the tree are tooling, not a client:
# `conformance/run_rs.py` drives the Rust CLI, and the two `scripts/check-*` gates read
# botocore's model and the AWS Pricing API. Both are still linted by `fmt` and `lint`.

[tasks.schema]
description = "Regenerate docs/schema.json from the serde types"
run = "cargo run -q -p agentd --bin schema"

[tasks."schema:check"]
description = "Fail if the committed schema no longer matches what is served"
# A stale generated artifact is worse than none: consumers trust it *because* it
# is generated, and a diff never reveals that it describes a protocol nobody
# serves.
run = "cargo run -q -p agentd --bin schema -- --check"

[tasks.spec]
description = "agentd.symspec.json consistency via symspec 0.1.0 + Z3"
# Covers `spec/agentd.symspec.json` ONLY — six draft requirements about the daemon's
# bootstrap and control-token rules. It is not the whole spec surface: `spec/core.symspec.json`
# is 51 requirements in the v5 `docVersion: 3` format, and the 0.1.0 `symspec` on PATH
# cannot read it at all — no state model, no effects/constraints, no reachability tier.
# That one is `spec:core`.
#
# Not in `check`'s dependency list: symspec is a global npm install plus a
# downloaded embedding model, so a fresh clone should not fail on its absence.
run = "symspec check spec/agentd.symspec.json --strict"

[tasks."spec:core"]
description = "microvms-core's 51 requirements: contradictions, coverage, and reachability"
# The v5 CLI by absolute path, not the `symspec` on PATH. That one is 0.1.0 and predates
# everything this document depends on: `core.symspec.json` carries a state model (5
# variables), 7 effects, and 3 constraints, and the tier that proves the constraints hold
# over *unbounded* runs is the reachability tier 0.1.0 does not have. Pointed at the wrong
# binary this does not fail loudly — it parses less and reports on less.
#
# `--reachability-timeout-ms 5000` rather than leaving it to inherit `--timeout-ms`, and the
# flag's own help says why: Z3's cancellation is cooperative, so an unbounded reachability
# query is an *uncancellable* one. This bound IS the cancellability mechanism, and 5s is
# comfortably above the 794ms the three constraints actually take.
#
# Out of `check`'s depends for the same reason `spec` is out: this needs a node path in
# someone's home directory. A gate that fails on a fresh clone is a gate people learn to
# skip, and `check` is the one command that must never be skipped. Verified 2026-08-08:
# 0 error findings, 202 warn / 56 info, 3 constraints proved under hypotheses, 0 violated,
# 0 unknown.
run = "node ~/workplace/symspec/packages/symspec/dist/cli.mjs check spec/core.symspec.json --reachability-timeout-ms 5000"

[tasks."model:check"]
description = "Fail if a hardcoded API constraint no longer matches botocore's service model"
# Same argument as `schema:check`, pointed the other way. That one asserts the
# generated artifact still describes what we serve; this one asserts the constants we
# wrote by hand still describe what AWS accepts. Both exist because a value nobody
# can disagree with drifts silently: this project published a 16 KB `runHookPayload`
# ceiling through several review passes against a model that says 4096.
#
# In `check` rather than `live` because the model is a file inside botocore — no
# network, no credentials, no money — so it costs the same as a lint and belongs
# where the gate is unconditional.
#
# TRAP-12's "verify each hardcoded service constraint against the pinned botocore service
# model in the build gate": `microvms-core`'s constants, read through
# `microvm constants --emit-json`, against the shipped model.
#
# It compared THREE ways while the Python client existed — each client against the model,
# then the two against each other. `MICROVM_REGIONS` and the sizing table are
# measurement-backed, so the model can say nothing about them and client-vs-client was the
# only check they could ever have. The script now holds its own pinned copies of those two
# and compares against them, which keeps a second reader for the two values that need one.
#
# No `depends = ["build-cli"]`, because the script reaches the Rust constants through
# `cargo run -q -p microvms-cli` itself. A prebuilt path would be faster and can be *stale*,
# and a stale constants dump is precisely this gate's failure mode — it would compare a
# value nobody ships and report agreement. Measured 2026-08-08: 0.4s warm, against 0.006s
# for the built binary, which is nothing beside the rest of `check`. `--rust-binary` exists
# for anyone who wants that trade knowingly.
run = "./scripts/check-model-drift"

[tasks.build]
description = "Release build for the shipping target"
run = "cargo build --release -p agentd --target $AGENTD_TARGET"

[tasks."build:cli"]
description = "Release build of the `microvm` CLI, for the host"
# NOT `$AGENTD_TARGET`. The daemon cross-compiles to aarch64-musl because it runs *inside*
# the guest; the CLI runs on the operator's machine, so building it for the guest's
# architecture would produce a binary that cannot execute here. Two different answers to
# "which target", because they are two different questions.
#
# Out of `check`'s depends: `cargo clippy --all-targets` in `lint` and `cargo test --all` in
# `test` already compile this crate, so a third build would add ~30s to the gate to produce
# an artifact only the live tier consumes.
run = "cargo build --release -p microvms-cli"

[tasks.check]
description = "The full local gate — the definition of done"
depends = ["lint", "security", "test", "schema:check", "model:check", "build"]

# ── live AWS suites (billable, manual) ──────────────────────────────────────

[tasks."live:infra"]
description = "Apply the conformance stack (idempotent)"
run = "terraform -chdir=conformance/infra init -input=false && terraform -chdir=conformance/infra apply -auto-approve -input=false"

# `live:conformance` was here: 56 checks through `conformance/run.py` and the Python
# client. The Python tier moved to git history after the Rust port went live-green — both
# suites passed against real AWS on the same commit, which is what retired the oracle
# rather than merely duplicating it. `live:conformance-rs` below is the live suite now,
# and it says in its own description how much of the 56 it can express.
#
# `live:probe` went the same way: `conformance/probe_suspend_resume.py` measured what a
# real suspend/resume cycle preserves, and its measurements live on in
# `docs/PLATFORM.md`, "Suspend and resume preserve everything". The suspend/resume
# *assertions* it fed are still run, by `live:conformance-rs`'s own suspend/resume
# section — the ticker gap, the surviving token, the surviving filesystem, the
# backgrounded process still counting. What is gone is the standalone probe that
# discovered them.

[tasks."live:conformance-rs"]
description = "The live suite through the Rust client: 38 of the oracle's 56 checks, plus the CLI's own"
depends = ["build", "build:cli", "live:infra"]
# Both binaries: `--binary` is the aarch64 daemon that gets baked into the image, and
# `--microvm-binary` is the host-architecture CLI under test. Naming both is what makes the
# two-target split above visible at the call site rather than only in a comment.
#
# 38 rather than 56, and the number is in the description on purpose. The CLI's `exec` is
# one-shot with a generated exec id and there is no `microvm cp`, `ack`, `exec --stream`, or
# `stdin` — so file transfer, tar round trips, the four hostile archives, SSE, stdin
# lifecycle, and the health flags are not expressible through this client. The suite prints
# each of the 34 it cannot express as SKIP with the missing subcommand named. Nothing runs
# those 34 against real AWS now; `microvms-core`'s local tiers cover the same surfaces
# against fakes. A description claiming 56 would be the more comfortable lie.
run = """
./conformance/run_rs.py \
  --binary target/$AGENTD_TARGET/release/agentd \
  --microvm-binary target/release/microvm
"""

[tasks."live:rates"]
description = "Fail if the pinned rate table no longer matches the AWS Pricing API"
# The same argument as `schema:check`: a stale pinned artifact is worse than none,
# because a consumer trusts a price *because* it is pinned and no diff reveals that
# it describes a bill nobody pays. `STALE_AFTER_DAYS` could only say nobody had
# looked; this looks.
#
# In `live` rather than `check` despite costing nothing — the Pricing API is free
# and creates no resources — because it needs network and credentials, and `check`
# is defined by needing neither. A gate that fails on a plane without AWS creds is
# a gate people learn to skip, and `check` is the one command that must never be
# skipped.
#
# A standalone script rather than a module in a client, because it used to be the Python
# client's `pricing` module and that client is now git history. The pinned figures are
# inlined there as literals — a deliberate second copy of `microvms-core`'s
# `pinned_rates()`, since a drift check that imported the values it checks would compare
# a table against itself. `scripts/check-live-rates --twin-only` runs that cross-check
# alone, offline and free, and it also runs first on this path.
run = "./scripts/check-live-rates"

[tasks."live:verify-clean"]
description = "Ask the account what leaked, rather than trusting teardown"
# Independent of the code that did the cleanup, which is the whole point:
# `terraform destroy` once reported success while six service-created log groups
# survived, because Terraform never owned them.
run = "./scripts/verify-clean"

[tasks.live]
description = "Every live suite, then an independent leak check. BILLABLE."
# `live:rates` is in here even though it is the one member that spends nothing and
# creates nothing. It is the cheapest thing in the tier and the only one that can
# tell you a figure this repo publishes has gone wrong, so leaving it out of the
# aggregate would mean it only ever ran when someone remembered to name it.
#
# `live:conformance-rs` is in here rather than left to be remembered, which is the same
# argument `live:rates` earned above. Every AWS-facing defect this project has hit was
# invisible until a real run, and the Rust client's live paths have *never* had one — its 628
# tests all go through an injected seam, so `ControlPlane::new` and everything past it are
# unexercised against the real service. A suite that only runs when someone names it is a
# suite that runs the week it is written.
#
# Three members rather than five. `live:conformance` and `live:probe` drove the Python
# client, and the Python tier moved to git history after the Rust port went live-green:
# both suites passed against real AWS on the same commit, so the oracle's job was
# finished rather than duplicated. `live:conformance-rs` is now the whole of the live
# protocol coverage, and it is honest about the 34 checks it cannot express.
depends = ["live:rates", "live:conformance-rs", "live:verify-clean"]
# Records the commit that was last proven against real AWS. The pre-push hook
# reads it to tell you whether the daemon has changed since — advisory only,
# because only a human knows whether a given change could touch the platform
# boundary. Lives in .git/ so it is per-clone and never committed: a marker
# claiming someone else's run is worse than no marker.
run = "git rev-parse HEAD > .git/agentd-last-live-run && echo 'recorded this commit as live-verified'"

[tasks."live:destroy"]
description = "Tear down the conformance stack"
run = "terraform -chdir=conformance/infra destroy -auto-approve"

# ── setup ───────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install git hooks"
run = "lefthook install"
