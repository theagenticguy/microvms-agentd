# SPDX-License-Identifier: Apache-2.0
# Accepted findings, each with its reason. An ignore without a reason is a
# finding someone silenced; an ignore with one is a decision someone made.
#
# Scope: MISCONFIGURATION and secret findings only. Dependency-vulnerability
# overrides live in .vex/microvms-agentd.openvex.json (OpenVEX), which trivy
# reads via TRIVY_VEX in CI. See .vex/README.md.
misconfigurations:
  - id: AVD-AWS-0132
    paths:
      - conformance/infra/main.tf
    statement: >-
      The conformance bucket holds a zipped daemon binary and a Dockerfile for
      the minutes a live run takes, then empties. SSE-S3 (AES256) already
      encrypts at rest; a customer-managed KMS key would add key policy,
      rotation, and per-request cost to protect a public repository's build
      artifact. Revisit if the bucket ever carries anything secret.
  - id: AVD-DS-0002
    paths:
      - examples/coding-agents-on-bedrock/Dockerfile
    statement: >-
      The daemon runs as root in the guest deliberately, and the trust contract
      says so: the control API grants root by design, so a token holder and a
      root workload are the same principal (docs/TRUST.md, "One boundary is out
      of scope"). Isolation comes from the MicroVM, which is one tenant per
      Firecracker VM with its own kernel, rather than from a uid inside it. A
      USER line would also break the example: agentd must chmod uploaded files
      and demote execs to the uid a caller names through `exec --user`, both of
      which need root. Revisit if the daemon ever stops needing to demote.
