[package]
name = "agentd-model"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
# A proof harness, not a library: it exists so `cargo test -p agentd-model` can
# explore every reachable bootstrap and exec state. There is nothing here for a
# consumer to depend on.
publish = false

[dependencies]
stateright = "0.31"
