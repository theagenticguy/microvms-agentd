[package]
name = "protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Wire types shared by the microvms-agentd daemon and its clients"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Same pin and the same two features as the daemon carries, and for the same
# reason: `preserve_order` must stay off or the committed `docs/schema.json` stops
# being a function of the types. One version of schemars in the tree is what makes
# the generated artifact reproducible across the two crates that feed it.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }

# Not a new edge in the tree — schemars already pulls `serde_json` in — but it is now
# a *runtime* one rather than only a dev one, and the reason is `RunHook::parse`.
# That function walks the payload as a `Value` instead of deriving the read, because
# the payload carries the agent token and serde's own error messages quote the value
# they rejected. Quoting a value there would put secret material into a log line and
# a response body, which is the one thing docs/TRUST.md promises never happens, so
# every refusal names a key or a shape and the walk is what makes that possible.
serde_json = "1"
