[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

# `maturin>=1.9.4` rather than `>=1.0` is load-bearing: from that release maturin
# sets PYO3_BUILD_EXTENSION_MODULE for a distribution build, which is what lets
# `Cargo.toml` omit pyo3's deprecated `extension-module` feature. With an older
# maturin the feature would be required, and enabling it breaks `cargo test` for
# every other member of this workspace.

[project]
name = "microvms"
version = "0.5.0"
description = "Python bindings over microvms-core: the MicroVMs client with every trap closure"
requires-python = ">=3.9"
readme = "README.md"
# PEP 639: an SPDX expression, which is why there is no
# `License :: OSI Approved :: ...` entry in `classifiers` below. The two forms are
# mutually exclusive — a wheel carrying both is rejected at build time.
license = "Apache-2.0"
keywords = ["microvms", "lambda", "aws", "sandbox", "microvm"]
# `abi3-py39` in Cargo.toml is what makes one wheel load on every version listed
# here, so this list is a claim about the interpreters the extension supports
# rather than a matrix the build has to enumerate.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Emulators",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://theagenticguy.github.io/microvms-agentd/"
Documentation = "https://theagenticguy.github.io/microvms-agentd/"
Repository = "https://github.com/theagenticguy/microvms-agentd"
Issues = "https://github.com/theagenticguy/microvms-agentd/issues"

[tool.maturin]
# Defaults to the Cargo.toml next to this file; stated because `maturin build -m`
# from the workspace root resolves it relative to the manifest, and being explicit
# is how the two invocations stay the same build.
manifest-path = "Cargo.toml"
# `abi3-py39` in Cargo.toml is what makes one wheel load on 3.9 and newer; nothing
# here needs to restate it.

# No `include` for `microvms.pyi` or `py.typed`, and no raised floor for either.
# maturin finds a `<module-name>.pyi` beside the manifest by itself — it logs "Found type
# stub file at microvms.pyi" — and when it does, it lays the wheel out as a *package*:
# `microvms/__init__.pyi`, `microvms/py.typed`, and a generated `microvms/__init__.py`
# re-exporting the extension. Naming either file in `include` would ship a second copy at
# the wheel root, where no checker looks.
#
# Verified against the floor rather than assumed: `maturin 1.9.4` — the version this
# `requires` already pins — packages both files exactly as 1.14.1 does. So typing the
# bindings needed no build-system change at all. The one thing that *does* want a newer
# maturin is `generate-stubs`, which is where the committed stub comes from, and that runs
# through `uvx maturin@1.14.1` inside `./scripts/generate-py-stubs.py` — a developer tool, not
# a build requirement. Pinning the floor to 1.14 would force every builder of this wheel to
# fetch a newer maturin to gain nothing at build time.

# No `[dependency-groups]`, and that is a measured omission rather than a
# preference: `maturin develop --uv` runs `uv pip install --group` relative to the
# *invocation* directory, so with a group declared here the command fails from the
# workspace root with "No pyproject.toml found at <workspace>/pyproject.toml". The
# test dependency is one package, installed alongside maturin itself, and a group
# that breaks the documented build command is not worth the tidiness.

