[package]
name = "microvms-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "the PyO3 bindings over microvms-core"
# Nothing publish-shaped: no keywords, no categories, no readme, and
# `publish = false` said out loud so a `cargo publish --workspace` cannot reach
# here by accident.
publish = false

# `cdylib` is the extension module Python imports; `rlib` is what lets `tests/`
# and doctests link the crate. cdylib alone produces E0432/E0463 for anything
# that tries to `use` it (research-bindings.yaml,
# pitfalls.cdylib-only-breaks-integration-tests).
[lib]
name = "microvms"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The only thing being wrapped. There is deliberately no edge to `microvms-cli`
# (BIND-1): a binding that depended on the CLI would be a binding whose surface
# is whatever the CLI happened to expose, and the CLI is a consumer of this same
# core rather than a layer above it.
microvms-core = { version = "0.1.1", path = "../microvms-core" }
# The wire types the session surface already answers with (`Health`, `Phase`,
# `Outcome`, `ExitEvent`). Not a new dependency in substance: `microvms-core`'s
# public signatures return these, so a binding that mapped them without naming
# the crate would have to re-declare their fields — which is exactly the drift
# `protocol` was extracted to make impossible (ARCH-2).
protocol = { package = "microvms-protocol", version = "0.1.1", path = "../protocol" }
# No `extension-module` feature. It is deprecated, and enabling it disables
# libpython linking for *every* target in the workspace, which breaks
# `cargo test` and `cargo build -p microvms-py` with undefined `_PyExc_*`
# symbols. maturin >= 1.9.4 sets PYO3_BUILD_EXTENSION_MODULE itself for a wheel
# build (research-bindings.yaml, extension_module_feature_note).
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# One multi-thread runtime for the whole process, blocked on with the GIL
# released. `sync` is the bounded channel the stream iterator hands events
# across; `time` is what the core's poll loops sleep on.
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time"] }

# No `futures-util`, and its absence is the point. It was here to name the
# `Stream` trait `ExecHandle::stream_with` answers with, because `Stream` is not
# in std and a `poll_next` needs the trait in scope. Core's
# `for_each_event_async` drives the same state machine through an `AsyncFnMut`,
# and both of those are std — so `src/exec.rs` advances the stream with nothing
# but this crate's own dependencies. Retired 2026-08-09.

[features]
# Off by default, and on only for `mise run stubs`. `pyo3/experimental-inspect` makes
# the macros emit an extra `_PYO3_INTROSPECTION_*` symbol per class, method, and
# function, which is the data `maturin generate-stubs` reads back out of the compiled
# cdylib to write `python/microvms/__init__.pyi`. Nothing at runtime reads those
# symbols, so the shipped wheel is built without the feature and carries none of them —
# the stub is a build-time artifact of the same source, not a payload.
#
# A feature rather than an unconditional dependency feature because "experimental" is
# pyo3's own word for it: the introspection format is explicitly unstable across pyo3
# releases. Behind a flag, a pyo3 bump that changes the format breaks `stubs:check` (a
# gate that names the command to run) instead of breaking the wheel every caller
# installs.
stubs = ["pyo3/experimental-inspect"]
