[package]
name = "microvms-js"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "the napi-rs bindings over microvms-core"
# Nothing publish-shaped. `package.json` carries `"private": true` for the npm
# side; this is the crates.io side of the same statement.
publish = false

# `cdylib` only, and that is the difference from `microvms-py`: a Node addon is
# loaded by the runtime and nothing in this workspace links it, so an `rlib`
# would be a second artifact with no consumer. The smoke test drives the built
# `.node` through `node --test`, not through `cargo test`.
[lib]
crate-type = ["cdylib"]

[dependencies]
# The only thing being wrapped. No edge to `microvms-cli` (BIND-1).
microvms-core = { version = "0.1.1", path = "../microvms-core" }
# The wire types the core's public signatures already answer with. See the same
# entry in `microvms-py/Cargo.toml` for why naming the crate beats re-declaring
# the shapes (ARCH-2).
protocol = { package = "microvms-protocol", version = "0.1.1", path = "../protocol" }
# `async` pulls in `tokio_rt`: an exported `#[napi] pub async fn` then runs on
# napi's managed runtime and returns a JavaScript Promise, with `Err` rejecting
# it. That is why this side needs no `block_on` bridge at all — Node is
# async-native, so the core's async surface maps straight through.
#
# `web_stream` is what makes `napi::bindgen_prelude::ReadableStream` exist, and it is the
# whole reason `src/process.rs` can hand JS two real `ReadableStream<Uint8Array>` objects
# rather than a pair of async iterators a consumer would have to adapt. The feature pulls in
# `futures-core` and `tokio-stream` *inside napi* and re-exports both, which is why this
# crate still declares no `futures-util` of its own (see the note at the bottom of this file).
#
# `napi5` and not `napi4`, forced by `web_stream` rather than chosen: napi 3.12's
# `web_stream` declares only `napi4`, but its `ReadableStream` finalizer calls
# `napi_add_finalizer`, which `napi-sys` gates behind `napi5`. Building with `web_stream` and
# `napi4` fails to compile inside napi itself (`napi_add_finalizer` not found in `sys`), so
# this is an under-declared dependency in that crate rather than a level this addon wanted.
# Node-API 5 shipped in Node 10.6; `package.json` already requires Node >= 22.13, which
# supports Node-API 9, so the raise costs no reachable runtime.
napi = { version = "3", default-features = false, features = [
    "napi5",
    "async",
    "web_stream",
] }
napi-derive = "3"
# The core's own poll and deadline paths need a runtime with `time`; napi
# provides the runtime, and this names the features the futures require. No
# `rt-multi-thread` — napi owns the runtime, and a library does not choose it.
tokio = { version = "1.53", features = ["time", "sync"] }

# No `futures-util`, and its absence is the point. It was here to name the
# `Stream` trait `ExecHandle::stream_with` answers with, because `Stream` is not
# in std and a `poll_next` needs the trait in scope. Core's
# `for_each_event_async` drives the same state machine through an `AsyncFnMut`,
# and both of those are std — so `src/exec.rs` advances the stream with nothing
# but this crate's own dependencies. Retired 2026-08-09.

[build-dependencies]
# Omitting `napi_build::setup()` produces undefined-symbol link failures, which
# is the one build-time requirement napi-rs still has — it uses no node-gyp and
# no Node headers, and resolves Node-API symbols at runtime through libloading.
napi-build = "2"
