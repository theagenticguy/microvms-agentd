[package]
name = "microvms-core"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "The MicroVMs control-plane and in-VM client: every trap closure, the cost engine, the sizing model"
readme = "README.md"
keywords = ["microvms", "lambda", "aws", "sandbox", "microvm"]
categories = ["api-bindings", "virtualization"]

# Dependencies are welcome here: a maintained, memory-safe crate beats hand-rolled
# code, and nothing about this manifest is frozen. (An earlier phase pinned this set
# up front so four parallel lanes could merge without manifest conflicts; that
# constraint ended with the lanes. Comments elsewhere that cite "the frozen set" or
# "T-W2-2 froze" describe that retired process, not a live rule.)
#
# Versions are checked with `cargo info` against the registry at the time of adding.
[dependencies]
# The wire contract, shared with the daemon rather than mirrored (ARCH-2). This is
# not optional: the
# alternative is a client that redefines `Phase`, `Outcome`, and the SSE event
# payloads locally, which is precisely the drift the protocol crate was extracted to
# make impossible. A field renamed in `protocol/` must break this crate's build.
protocol = { package = "microvms-protocol", version = "0.3.0", path = "../protocol" }
# The error taxonomy's Display impls. 2.x rather than 1.x: `#[error]` on an enum
# with `#[from]` is the same surface, and the 2.0 line is what receives fixes.
thiserror = "2.0.19"
# `constants::as_json` is the drift gate's second source (TRAP-12), so serde is a
# runtime dependency of this crate rather than a test convenience: the CLI dumps
# that value and `scripts/check-model-drift.py` compares it against the pinned
# service model.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── the cost engine (T-W2-3) ────────────────────────────────────────────────
# Money is decimal or it is wrong (COST-6): the ARM rates are figures like
# 0.0000276944 and summing a few thousand of them in binary floating point drifts
# in the direction of a bill nobody can reproduce. `serde-with-str` is what keeps
# a Decimal in the JSON envelope as `"0.0000276944"` rather than as an f64 that
# has already lost the exactness the type exists to hold.
rust_decimal = { version = "1.42", features = ["serde-with-str"] }
# The calendar behind CalendarDate. `std` only — no tzdb: the one consumer measures
# rate-table age in whole UTC days, so the timezone database would be dead weight.
jiff = { version = "0.2", default-features = false, features = ["std"] }
rust_decimal_macros = "1.40"

# ── the control plane (T-W2-4) ──────────────────────────────────────────────
# Hand-signed rather than a generated SDK: `lambda-microvms` has no aws-sdk-rust
# crate, so the choice is between vendoring smithy codegen and signing 24
# rest-json operations by hand. `default-https-client` stays ON: the credential
# chain does its own HTTP (IMDS, SSO, STS) through smithy's client and panics at
# load() without one — every ControlPlane::new in the wild hit that before this
# feature returned. Two HTTP stacks (smithy for credentials, reqwest for the
# service calls) is the price; both sit on rustls, so it is one TLS
# implementation, and this crate runs on the developer host or harness — agentd
# is what ships into the MicroVM image, not this.
aws-config = { version = "1.10", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-credential-types = "1.3"
# Default features are `sign-http` + `http1`, which is the http-1.x path:
# `apply_to_request_http1x` mutates an `http::Request` that reqwest 0.13 consumes
# through `TryFrom`. Anything else means converting between two http versions on
# every call.
aws-sigv4 = "1.5"
# `rustls` rather than `default-tls`: the daemon ships to an aarch64 musl target
# and a native-tls build there needs an OpenSSL the image does not carry. `json`
# off deliberately — the control plane's rest-json bodies go through serde_json
# directly so the error path can read a raw body, which is the only way to see an
# AccessDeniedException whose message field is null (TRAP-6).
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "charset",
    "stream",
] }
http = "1.5"
# Retry with jitter for throttles and 5xx. aws-smithy-runtime has the same thing
# behind its `client` feature, but taking it would mean taking the smithy client
# that `default-features = false` above just declined.
backon = { version = "1.6", features = ["tokio-sleep"] }
# The image build takes a zip of the daemon binary plus a Dockerfile
# (sandbox.py:523 `build_artifact`). Pinned to the 8.x line: 9.0 exists only as
# `9.0.0-pre2`, and a pre-release in a shipping manifest is a version that can
# change under you. Only `deflate` — the artifact is one binary and one text file,
# so aes/bzip2/lzma/ppmd/xz/zstd are compressors this crate will never select and
# C libraries it would otherwise have to build for the musl target.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# `build --reuse` keys an image name to a content hash of the artifact bytes, so an
# unchanged binary+Dockerfile reuses its image and a changed one gets a fresh name —
# which is the fix for the stale-snapshot-on-name-reuse hazard. sha2 is already in
# the tree transitively through aws-sigv4; this makes the edge direct and versioned.
sha2 = "0.11"

# ── the in-VM session (T-W2-5) ──────────────────────────────────────────────
# Same pin as the daemon carries. `time` for the poll and deadline paths, `sync`
# for the proxy-token refresh, `io-util` for the SSE reader; no `rt-multi-thread`,
# because a library does not choose the caller's runtime. `net` is the port
# forwarder's listener (`session::forward`) — it lives here rather than in the CLI
# because `microvms-cli/tests/thinness.rs` forbids an HTTP stack there, and a
# forwarder is an HTTP server.
tokio = { version = "1.53", features = [
    "time",
    "sync",
    "io-util",
    "macros",
    "net",
] }
futures-util = "0.3"
# The WebSocket client behind `session::tunnel`. Required rather than convenient: the
# endpoint proxy takes a WebSocket's credential as `Sec-WebSocket-Protocol` values and has
# no CONNECT method, so an upgrade replayed over the HTTPS path is answered 400 by the proxy
# (measured 2026-08-29, docs/PLATFORM.md). Carrying TCP therefore needs a real handshake,
# which reqwest's client cannot perform. `rustls-tls-webpki-roots` matches the one TLS
# implementation already in the tree — a native-tls build would need an OpenSSL the guest
# image does not carry.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
# Exec output and stdin are arbitrary bytes and a JSON string cannot hold
# arbitrary bytes, so both sides of the wire carry base64. 0.23 to match agentd:
# one version in the tree means the client and the daemon cannot disagree about
# padding or alphabet.
base64 = "0.23"
# Hex rendering for tokens and the artifact content hash. Encode-only.
const-hex = "1.19"
# The kernel CSPRNG behind one call, for the agent token and idempotency nonces.
# Replaces two hand-rolled /dev/urandom reads and their clock-mixing fallbacks —
# getrandom's own failure story (it aborts only if the OS pool is truly unavailable,
# which on Linux means the kernel is broken) is stronger than the fallback was.
getrandom = "0.4"
# RFC 3986 percent-encoding for query values and path segments. Replaces two
# hand-rolled encoders; the AsciiSets keep their exact behavior (everything outside
# the unreserved set is escaped, including `/` and `:` in path segments).
percent-encoding = "2.3"
# The initiator half of the tunnel identity proof (#70 layer 3): Noise KK against
# the per-VM key the launch delivered, so `--verify-identity` proves the far end is
# the VM this host launched without trusting the endpoint proxy. The same feature
# selection as agentd's, for the same measured reason (see agentd/Cargo.toml): the
# `std` feature force-enables `ring`, whose build script needs a musl cross C
# compiler this repo's targets do not assume.
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-sha2",
    "use-getrandom",
] }
# Deriving the public half of a launch-generated seed without a handshake — the pin
# the ledger stores, and the value the daemon must independently agree on. The same
# crate snow's resolver uses internally, so one x25519 implementation in the tree.
# Held at 2.x on purpose while snow 0.10 pins curve25519-dalek 4: the 3.0 line moves to
# curve25519-dalek 5, and taking it puts two copies of the same curve arithmetic in the
# tree — the exact duplication this crate was chosen to avoid. Revisit when snow bumps.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

[dev-dependencies]
# The size-class and region guards are table-shaped, which is exactly where a
# hand-picked example set passes over the gap it was written to find.
proptest = "1.11"
# Deterministic network simulation for the reconnect-at-cursor tests, mirroring
# the daemon's dev-dependencies so both sides of the protocol are exercised under
# the same simulated clock.
turmoil = "0.7.2"
hyper = { version = "1.11", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "server",
    "tokio",
] }
